<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💰 수급분석기</title>
<style>
  :root{
    --bg:#0f131a; --panel:#161b23; --line:#252c37; --text:#e6ebf2; --muted:#8b97a7;
    --kospi:#3b82f6; --kosdaq:#f59e0b; --accent:#22c55e; --est:#eab308;
    --up:#fca5a5; --down:#93c5fd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","맑은 고딕",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .navlink{color:var(--est);text-decoration:none;font-size:13px;font-weight:700;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .navlink:hover{border-color:var(--est)}
  .clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .meta{color:var(--muted);font-size:12px;margin-left:auto}
  .controls{display:flex;gap:8px;align-items:center}
  input[type=search]{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;font-size:13px;width:130px}
  .chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;user-select:none;color:var(--muted)}
  .chip.kospi.on{background:rgba(59,130,246,.2);color:#93c5fd;border-color:var(--kospi)}
  .chip.kosdaq.on{background:rgba(245,158,11,.2);color:#fcd34d;border-color:var(--kosdaq)}
  .wrap{display:flex;gap:16px;padding:16px;align-items:flex-start;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .main{flex:3;min-width:520px}
  .side{flex:1;min-width:240px;display:flex;flex-direction:column;gap:16px}
  .ttl{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .ttl .sub{font-size:11px;font-weight:400;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 8px;text-align:right;white-space:nowrap}
  th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);font-size:11px;position:sticky;top:0;background:var(--panel)}
  td.l,th.l{text-align:left}
  tbody tr{border-bottom:1px solid #1d232d;cursor:pointer}
  tbody tr:hover{background:#1b212b}
  tbody tr.sel{background:#243040;box-shadow:inset 3px 0 0 var(--est)}
  .rk{color:var(--muted);width:26px}
  .nm{font-weight:700}
  .mk{font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px}
  .mk.KOSPI{background:rgba(59,130,246,.2);color:#93c5fd}
  .mk.KOSDAQ{background:rgba(245,158,11,.2);color:#fcd34d}
  .sigmk{font-size:10px;font-weight:800;margin-left:6px;white-space:nowrap}
  .sigmk.lead{color:#93c5fd}   /* 🔵 선행: 매집 중 미상승 */
  .sigmk.lag{color:#fca5a5}    /* 🔥 후행: 이미 상승 */
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
  .val{font-weight:700}
  .mv{display:flex;justify-content:space-between;padding:5px 4px;border-bottom:1px solid #1d232d;font-size:13px}
  .mv .nm{font-weight:600}
  .empty{color:var(--muted);padding:20px;text-align:center}
  /* 종목 상세 패널 */
  .det-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .det-hd .dnm{font-size:16px;font-weight:800}
  .det-close{margin-left:auto;cursor:pointer;color:var(--muted);font-size:16px;border:1px solid var(--line);border-radius:6px;padding:0 8px}
  .det-sub{font-size:12px;color:var(--muted);margin-bottom:8px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .bdg{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
  .bdg.buyturn{background:rgba(239,68,68,.18);color:#fca5a5;border-color:#ef4444}
  .bdg.streak{background:rgba(239,68,68,.12);color:#fca5a5}
  .bdg.vol{background:rgba(234,179,8,.18);color:#fde68a;border-color:#eab308}
  .bdg.low{background:rgba(148,163,184,.15);color:#cbd5e1}
  .det table td,.det table th{padding:4px 6px;font-size:12px}
  tr.surge{background:rgba(234,179,8,.08)}
</style>
<script src="common.js"></script>
</head>
<body>
<header>
  <h1>💰 수급분석기</h1>
  <a class="navlink" href="index.html">← 📅 공시캘린더</a>
  <a class="navlink" href="sectors.html">🔄 섹터로테이션</a>
  <span class="clock" id="clock">--:--:--</span>
  <span class="meta" id="meta">불러오는 중…</span>
  <div class="controls">
    <input type="search" id="q" placeholder="종목명 검색">
    <span class="chip kospi on" data-market="KOSPI">KOSPI</span>
    <span class="chip kosdaq on" data-market="KOSDAQ">KOSDAQ</span>
  </div>
</header>

<div class="wrap">
  <div class="card main">
    <div class="ttl">🔥 거래대금 상위 <span class="sub">— 회전율=거래대금/시총 · 🔵선행(매집 중 아직 미상승) · 🔥후행(매집+이미 상승) · 클릭 시 상세</span></div>
    <div style="max-height:76vh;overflow:auto">
      <table>
        <thead><tr>
          <th class="rk">#</th><th class="l">종목</th><th>등락률</th><th>거래대금</th>
          <th>시총</th><th>거래대금<br>/시총</th><th>외국인<br>순매수</th><th>외국인<br>/시총</th>
        </tr></thead>
        <tbody id="valBody"></tbody>
      </table>
    </div>
  </div>
  <div class="side" id="sideBox"></div>
</div>

<script>
// 진단용: 초기화가 멈추면 원인을 헤더(meta)에 표시 (F12 없이 원인 파악)
window.addEventListener("error", e=>{
  const m=document.getElementById("meta"); if(m) m.textContent="⚠️ JS오류: "+(e.message||"")+" @"+(e.lineno||"?")+":"+(e.colno||"?");
});
window.addEventListener("unhandledrejection", e=>{
  const m=document.getElementById("meta"); if(m) m.textContent="⚠️ 비동기오류: "+((e.reason&&(e.reason.message||e.reason))||"");
});
let FLOW = {by_value:[], up:[], down:[], universe:0, generated_at:""};
const filters = {KOSPI:true, KOSDAQ:true, q:""};
// esc() 는 common.js 에서 제공

function eok(won){   // 원 → 억/조 표시
  if(won==null) return "-";
  const eok = won/1e8;
  if(eok >= 10000) return (eok/10000).toFixed(2).replace(/\.?0+$/,"")+"조";
  return Math.round(eok).toLocaleString()+"억";
}
function qty(n){   // 순매수 주식수 (매수=빨강 / 매도=파랑)
  if(n==null) return `<span class="flat">-</span>`;
  const cls = n>0?"up":(n<0?"down":"flat");
  const s = (n>0?"+":"")+Number(n).toLocaleString();
  return `<span class="${cls}">${s}</span>`;
}
function rateCell(r){
  if(r==null) return `<span class="flat">-</span>`;
  const cls = r>0?"up":(r<0?"down":"flat");
  return `<span class="${cls}">${r>0?"+":""}${r}%</span>`;
}
function pct(v){   // 거래대금/시총 (%) — 부호 없는 회전율
  return v==null ? `<span class="flat">-</span>` : `${v}%`;
}
function pctSigned(v){   // 외국인/시총 (%) — 매수 빨강 / 매도 파랑
  if(v==null) return `<span class="flat">-</span>`;
  const cls = v>0?"up":(v<0?"down":"flat");
  return `<span class="${cls}">${v>0?"+":""}${v}%</span>`;
}
function pass(r){
  if(!filters[r.market]) return false;
  const q = filters.q.trim().toLowerCase();
  return !q || (r.name||"").toLowerCase().includes(q) || (r.code||"").includes(q);
}

let SEL = null;   // 선택된 종목코드 (상세 패널 열림)

function render(){
  const rows = FLOW.by_value.filter(pass);
  document.getElementById("valBody").innerHTML = rows.length ? rows.map((r,i)=>`
    <tr data-code="${esc(r.code)}"${r.code===SEL?' class="sel"':''}>
      <td class="rk">${i+1}</td>
      <td class="l"><span class="nm">${esc(r.name)}</span><span class="mk ${esc(r.market)}">${esc(r.market)}</span>${(r.sig&&r.sig.length)?`<span class="sigmk ${r.lead?"lead":"lag"}" title="${r.lead?"선행: 매집 중 아직 미상승":"후행: 매집+이미 상승"} (5일 ${r.ret5}%)">${r.lead?"🔵":"🔥"}${r.sig.map(s=>esc(s.who)+s.days+"일").join(" ")}</span>`:""}</td>
      <td>${rateCell(r.rate)}</td>
      <td class="val">${eok(r.value)}</td>
      <td>${eok(r.mktcap)}</td>
      <td>${pct(r.turnover)}</td>
      <td>${qty(r.frgn)}</td>
      <td>${pctSigned(r.frgn_pct)}</td>
    </tr>`).join("") : `<tr><td colspan="8" class="empty">데이터 없음</td></tr>`;
  document.getElementById("meta").textContent =
    `대상 ${FLOW.universe}종목 · 갱신 ${FLOW.generated_at||"-"}`;
  if(!SEL) renderSide();
}

function renderSide(){
  const mv = (list)=> list.filter(pass).map(r=>`
    <div class="mv" data-code="${esc(r.code)}"><span class="nm">${esc(r.name)}</span>${rateCell(r.rate)}</div>`).join("")
    || `<div class="empty">해당 없음</div>`;
  document.getElementById("sideBox").innerHTML =
    `<div class="card"><div class="ttl">📈 상승 상위</div>${mv(FLOW.up)}</div>
     <div class="card"><div class="ttl">📉 하락 상위</div>${mv(FLOW.down)}</div>
     <div class="empty" style="font-size:12px">행을 클릭하면 종목 수급 상세가 여기 열립니다</div>`;
}

async function load(){
  try{
    const res = await fetch("data/flow.json?_="+Date.now(), {cache:"no-store"});
    FLOW = await res.json();
  }catch(e){
    FLOW = {by_value:[], up:[], down:[], universe:0, generated_at:""};
    document.getElementById("meta").textContent = "flow.json 로드 실패: " + (e.message||e);
  }
  render();
}

async function openDetail(code){
  SEL = code;
  document.getElementById("sideBox").innerHTML = `<div class="card"><div class="empty">수급 상세 불러오는 중…</div></div>`;
  let d;
  try{ d = await (await fetch("/api/flow?code="+encodeURIComponent(code))).json(); }
  catch(_){ d = {error:"조회 실패"}; }
  if(SEL !== code) return;   // 그 사이 다른 종목 선택됨
  renderDetail(d);
  render();   // 랭킹의 선택 하이라이트 갱신 (SEL 유지 → sideBox는 안 건드림)
}
function closeDetail(){ SEL = null; renderSide(); render(); }

function renderDetail(d){
  const box = document.getElementById("sideBox");
  const q = d.quote || {};
  if(d.error || !d.rows){
    box.innerHTML = `<div class="card"><div class="det-hd"><span class="dnm">${esc(d.name||SEL)}</span>
      <span class="det-close" onclick="closeDetail()">✕ 닫기</span></div>
      <div class="empty">상세를 불러오지 못했습니다</div></div>`;
    return;
  }
  const cap = q.mktcap, val = q.value;
  const turn = (val && cap) ? (val/cap*100).toFixed(2)+"%" : "-";
  const badges = (d.signals||[]).map(s=>`<span class="bdg ${esc(s.t)}">${esc(s.label)}</span>`).join("")
    || `<span class="empty" style="font-size:11px">특이 신호 없음</span>`;
  const rowsH = d.rows.slice().reverse().map(r=>`
    <tr class="${(r.volx||0)>=2?'surge':''}">
      <td class="l">${r.date.slice(4,6)}/${r.date.slice(6,8)}</td>
      <td>${r.close!=null?Number(r.close).toLocaleString():'-'}</td>
      <td>${rateCell(r.rate)}</td>
      <td>${r.vol!=null?(r.vol/1e4).toFixed(0)+'만':'-'}${r.volx!=null?` <span class="flat">x${r.volx}</span>`:''}</td>
      <td>${qty(r.frgn)}</td>
      <td>${qty(r.org)}</td>
      <td>${qty(r.indi)}</td>
    </tr>`).join("");
  box.innerHTML = `<div class="card det">
    <div class="det-hd"><span class="dnm">${esc(d.name||"")}</span>
      <span class="mk ${esc(q.market||'')}">${esc(SEL)}</span>${rateCell(q.rate)}
      <span class="det-close" onclick="closeDetail()">✕ 닫기</span></div>
    <div class="det-sub">현재가 ${q.price!=null?Number(q.price).toLocaleString():'-'} · 시총 ${eok(cap)} · 거래대금 ${eok(val)} (회전율 ${turn})</div>
    <div class="badges">${badges}</div>
    <table><thead><tr><th class="l">날짜</th><th>종가</th><th>등락</th><th>거래량(배수)</th><th>외국인</th><th>기관</th><th>개인</th></tr></thead>
      <tbody>${rowsH}</tbody></table>
    <div class="det-sub" style="margin-top:8px">구간 누적 — 외국인 ${qty(d.cum_frgn)} · 기관 ${qty(d.cum_org)} <span class="flat">(외국인/기관계/개인 3분류 · 세부기관은 KRX 차단)</span></div>
  </div>`;
}

// 랭킹 행 · 상승/하락 목록 클릭 → 종목 수급 상세
document.getElementById("valBody").addEventListener("click",e=>{
  const tr = e.target.closest("tr[data-code]"); if(!tr) return;
  openDetail(tr.dataset.code);
});
document.getElementById("sideBox").addEventListener("click",e=>{
  const el = e.target.closest("[data-code]"); if(!el) return;
  openDetail(el.dataset.code);
});
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
  const m=c.dataset.market; filters[m]=!filters[m]; c.classList.toggle("on",filters[m]); render();
}));
document.getElementById("q").addEventListener("input",e=>{ filters.q=e.target.value; render(); });

// 시계
setInterval(()=>{ const d=new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("ko-KR",{hour12:false}); },1000);

// SSE: data/ 변경 시 즉시 재로드 (flow.json 갱신 반영) + index.html/flow.html 변경 시 reload
// openChart() 는 common.js 에서 제공
let _es;
function connectSSE(){
  try{
    _es = new EventSource("/events");
    _es.onmessage = ()=> load();
    bindChartSSE(_es);   // 공통: reload=새로고침 / openchart=토스트 클릭 차트 (common.js)
    _es.onerror = ()=>{ _es.close(); setTimeout(connectSSE, 3000); };
  }catch(_){}
}
load();
connectSSE();
setInterval(load, 30000);   // SSE 실패 대비 폴백
</script>
</body>
</html>
