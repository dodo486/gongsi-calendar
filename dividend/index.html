<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 배당·증자 캘린더</title>
<script src="vendor/fullcalendar.min.js"></script>
<style>
  :root{
    --bg:#0f1116; --panel:#171a21; --line:#262b36; --text:#e6e9ef; --muted:#8b93a3;
    --kospi:#3b82f6; --kosdaq:#f59e0b; --accent:#22c55e; --div:#a855f7; --exp:#ef4444; --est:#eab308;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .meta{color:var(--muted);font-size:12px}
  .controls{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
  input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:8px;width:200px;font-size:13px}
  .chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;user-select:none}
  .chip.on{color:#fff}
  .chip.kospi.on{background:var(--kospi);border-color:var(--kospi)}
  .chip.kosdaq.on{background:var(--kosdaq);border-color:var(--kosdaq)}
  .cal-row{display:flex;height:calc(100vh - 90px);min-height:560px}
  .cal-col{display:flex;flex-direction:column;flex:1;min-height:0}
  #calendar{flex:1;padding:14px;overflow:auto}
  #side{width:360px;border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow:auto}
  #side h2{font-size:14px;color:var(--muted);margin:0 0 10px}
  .detail .corp{font-size:18px;font-weight:700}
  .detail .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:middle}
  .badge.KOSPI{background:rgba(59,130,246,.2);color:#93c5fd}
  .badge.KOSDAQ{background:rgba(245,158,11,.2);color:#fcd34d}
  .detail .title{margin:12px 0;font-size:15px;line-height:1.5}
  .detail .big{font-size:26px;font-weight:800;color:var(--div);margin:10px 0}
  .detail .row{font-size:13px;color:var(--muted);margin:4px 0}
  .btn{display:inline-block;margin-top:14px;background:var(--accent);color:#04240f;font-weight:700;padding:10px 14px;border-radius:8px;text-decoration:none;font-size:14px}
  .empty{color:var(--muted);font-size:13px}
  .dortab{width:100%;border-collapse:collapse;font-size:13px}
  .dortab th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .dortab th[data-sk]:hover{color:var(--div)}
  .dortab th .ar{font-size:10px;color:var(--muted)}
  .dortab td{padding:6px 8px;border-bottom:1px solid var(--line)}
  .dortab tr.dor{cursor:pointer}
  .dortab tr.dor:hover td{background:var(--bg)}
  .dortab td.nm{font-weight:600}
  .dortab td.px{text-align:right;color:var(--muted);white-space:nowrap}
  .dortab td.dt{text-align:right;color:var(--muted);font-size:11px;white-space:nowrap}
  .why{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .why .wh{font-weight:700;font-size:13px;margin-bottom:8px;color:var(--est)}
  .why .row{font-size:12.5px;line-height:1.55}
  .why .ev{font-size:12px;color:var(--muted);margin:3px 0;line-height:1.5}
  .fc{--fc-border-color:var(--line);--fc-page-bg-color:transparent;--fc-neutral-bg-color:#1b1f28;
      --fc-today-bg-color:rgba(34,197,94,.08);--fc-list-event-hover-bg-color:#1b1f28}
  .fc .fc-toolbar-title{font-size:16px}
  /* 휴장일(공휴일) — 날짜 글자 빨간색 (오늘 동그라미보다 먼저 선언해 오늘이 우선) */
  .fc .holiday .fc-daygrid-day-number{color:#ef4444;font-weight:700}
  /* 오늘 날짜 강조 — 초록 동그라미 (만기일 노란 별표와 헷갈리지 않게) */
  .fc .fc-day-today .fc-daygrid-day-number{
    background:#22c55e;color:#04240f;font-weight:800;
    min-width:26px;height:26px;padding:0 3px;margin:3px;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:999px;box-shadow:0 0 0 3px rgba(34,197,94,.35);}
  /* 만기일(선물·옵션) — 날짜 옆 노란 별표 */
  .fc .expday .fc-daygrid-day-number::after{
    content:"★";color:#facc15;margin-left:2px;font-size:13px;
    text-shadow:0 0 2px rgba(0,0,0,.5);vertical-align:top;}
  .fc .fc-button{background:var(--panel);border-color:var(--line);color:var(--text);text-transform:none}
  .fc .fc-button-primary:not(:disabled).fc-button-active{background:var(--accent);border-color:var(--accent);color:#04240f}
  .fc-daygrid-event{cursor:pointer;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width: 800px){   /* 모바일: 세로 배치, 사이드는 캘린더 아래로 */
    header{padding:10px 12px;gap:8px}
    header h1{font-size:16px}
    .meta{display:none}
    .controls{margin-left:0;width:100%}
    input[type=search]{width:110px;flex:1}
    .cal-row{flex-direction:column;height:auto}
    #calendar{height:62vh;padding:8px;flex:none}
    #side{width:auto;border-left:none;border-top:1px solid var(--line)}
    .fc .fc-toolbar-title{font-size:14px}
    .fc-daygrid-event{font-size:10px}
  }
  .cal-bar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .cal-bar-lbl{font-size:13px;font-weight:700;color:var(--muted)}
  .cal-legend{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .cal-legend .lg{display:inline-flex;align-items:center;gap:3px}
  .cal-legend .lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .divlist .lh{font-size:13px;font-weight:700;margin-bottom:10px}
  .divlist .di{padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;background:var(--bg)}
  .divlist .di:hover{border-color:var(--div)}
  .divlist .di b{font-size:14px}
  .divlist .di .sub{font-size:12px;color:var(--muted)}
  .divlist .mkt{font-size:10px;padding:1px 6px;border-radius:5px;margin-left:4px}
  .mkt.KOSPI{background:rgba(59,130,246,.2);color:#93c5fd}
  .mkt.KOSDAQ{background:rgba(245,158,11,.2);color:#fcd34d}
  .back{display:inline-block;margin-bottom:10px;color:var(--div);cursor:pointer;font-size:13px}
  /* 지수배당포인트 (사이드 상단) — 지수 카드(접기) > 포함 종목·배당금·배당락일 */
  .dp{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .dp .lh{font-size:13px;font-weight:700;margin-bottom:8px}
  .dpf{font-size:12px;line-height:1.55;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px}
  .dpf span{color:var(--muted);font-size:11px}
  .dpc{border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--bg)}
  .dpc>summary{cursor:pointer;padding:9px 10px;list-style-position:inside;font-size:14px}
  .dpc>summary .dpt{float:right;font-weight:800;color:var(--div)}
  .dpc>summary .dps{display:block;font-size:11px;color:var(--muted);margin-top:2px;padding-left:14px}
  .dpc[open]>summary{border-bottom:1px solid var(--line)}
  .dpm{font-size:11px;color:var(--muted);padding:6px 10px}
  .dperr{color:#f87171}
  .dpi{font-size:12px;margin:0 0 4px}
  .dpi td{padding:4px 8px}
  .dpi th{cursor:default}
  .st{font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;margin-left:3px}
  .st.ok{background:rgba(34,197,94,.18);color:#86efac}
  .st.half{background:rgba(59,130,246,.18);color:#93c5fd}
  .st.est{background:rgba(234,179,8,.18);color:#fde047}
  .st.und{background:rgba(239,68,68,.16);color:#fca5a5}
  /* 기준일 확정 5단계 사다리 */
  .lad{margin:6px 0 2px;display:flex;flex-direction:column;gap:3px}
  .lad .st{display:flex;align-items:flex-start;gap:7px;font-size:12px;line-height:1.45;padding:2px 5px;border-radius:5px}
  .lad .st .dot{flex:none;width:15px;text-align:center}
  .lad .st.none{color:var(--muted)}
  .lad .st.cur{background:rgba(234,179,8,.13);outline:1px solid rgba(234,179,8,.35)}
  .lad .st b{font-weight:700}
  .lad .st .sub{color:var(--muted);font-weight:400}
  .anc{font-size:12.5px;margin:6px 0 2px;padding:6px 8px;border-radius:6px;background:rgba(124,197,255,.08);border:1px solid rgba(124,197,255,.25)}
  /* 배당 — 권리락(T-1) 진빨강 / 매수일(T-2) 연빨강 */
  .fc-event.dv-ex{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:600}
  .fc-event.dv-buy{background:#fca5a5;border-color:#fca5a5;color:#3a0a0a;font-weight:600}
  .fc-event.est{background:var(--est);border-color:var(--est);color:#241a00;font-weight:600}
  /* 무상증자 — 권리락(T-1) 보라 / 권리부매수(T-2) 연보라 */
  .fc-event.cap-bonus-ex{background:#a855f7;border-color:#a855f7;font-weight:600}
  .fc-event.cap-bonus-buy{background:#c4b5fd;border-color:#c4b5fd;color:#1a1030;font-weight:600}
  /* 유상증자 — 권리락(T-1) 파랑 / 권리부매수(T-2) 하늘 */
  .fc-event.cap-rights-ex{background:#3b82f6;border-color:#3b82f6;font-weight:600}
  .fc-event.cap-rights-buy{background:#7dd3fc;border-color:#7dd3fc;color:#04222a;font-weight:600}
  /* 신주 상장(입고)일 — 무·유 공통 초록 / 유상 신주인수권증서 상장(입고)일 핑크 */
  .fc-event.cap-list{background:#10b981;border-color:#10b981;color:#022c22;font-weight:700}
  .fc-event.cap-warrant{background:#ec4899;border-color:#ec4899;color:#2a0716;font-weight:700}
  /* 무상 매도 가능일(신주상장 T-2, 잔고 입고) — 주황 */
  .fc-event.cap-sell{background:#f59e0b;border-color:#f59e0b;color:#2a1700;font-weight:700}
  /* 거래정지 — 정지 시작(진회색) / 거래재개 초록, 예정이면 점선 테두리 */
  .fc-event.halt-stop{background:#4b5563;border-color:#374151;color:#f3f4f6;font-weight:700}
  .fc-event.halt-resume{background:#10b981;border-color:#10b981;color:#022c22;font-weight:700}
  .fc-event.halt-tent{background:transparent;border:1.5px dashed #10b981;color:#10b981}
  /* 목록 보기 — 하루치 안에서 색 띠가 이어 보이지 않게 행 배경은 그대로, 점만 색 */
  .fc-list-event td{background:transparent!important}
</style>
</head>
<body>
<header>
  <h1>💰 배당·증자</h1>
  <span class="meta" id="meta">불러오는 중…</span>
  <div class="controls">
    <input type="search" id="q" placeholder="회사명 검색">
    <span class="chip kospi on" data-market="KOSPI">KOSPI</span>
    <span class="chip kosdaq on" data-market="KOSDAQ">KOSDAQ</span>
  </div>
</header>
<div class="cal-row">
  <div class="cal-col">
    <div class="cal-bar">
      <span class="cal-bar-lbl">💰 배당·증자·거래정지 일정</span>
      <span class="cal-legend">
        <span class="lg"><i style="background:#dc2626"></i><i style="background:#fca5a5"></i> 배당</span>
        <span class="lg"><i style="background:var(--est)"></i> 예상배당</span>
        <span class="lg"><i style="background:#a855f7"></i><i style="background:#c4b5fd"></i> 무상</span>
        <span class="lg"><i style="background:#3b82f6"></i><i style="background:#7dd3fc"></i> 유상</span>
        <span class="lg"><i style="background:#f59e0b"></i> 무상 매도가능(잔고 입고)</span>
        <span class="lg"><i style="background:#10b981"></i> 신주상장(입고)·거래재개</span>
        <span class="lg"><i style="background:#ec4899"></i> 신주인수권(유상)</span>
        <span class="lg"><i style="background:#4b5563"></i> 거래정지</span>
        <span>· 진한색=권리락(T-1), 연한색=매수일(T-2)</span>
      </span>
    </div>
    <div id="calendar"></div>
  </div>
  <div id="side">
    <h2>오늘의 배당공시</h2>
    <div id="detail" class="empty">캘린더에서 항목을 클릭하면 여기에 내용이 표시됩니다.</div>
  </div>
</div>
<script>
// 배당 페이지는 이 폴더만으로 동작한다 — 데이터는 DATA 아래 DATA_FILES 만 읽는다(따로 배포할 때 이 파일들만 같이 올림)
const DATA = "../data/";
const DATA_FILES = ["dividends.json","capital.json","research.json","halts.json","divpoints.json","expiries.json"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const won = n => Number(n).toLocaleString("ko-KR");
const pctTxt = v => (v===null||v===undefined) ? "-" : `${v>0?"+":""}${v}%`;
const dISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function openChart(code){ if(/^\d{6}$/.test(code || "")) window.open("https://alphasquare.co.kr/home/stock-summary?code=" + code, "alphachart"); }
let DIV = [], CAP = [], HALT = [], EXP = [];
let RES = {companies:{}, events:[]};   // 리서치: 기준일 판정 + 예상배당(research.json)
let DP = null;                         // 지수배당포인트(divpoints.json)
let HOL = new Set(), EXPD = new Set(); // 휴장일·만기일 ISO 날짜 — 캘린더 날짜 빨간 글자·노란 별표
let calendar;
const filters = { q:"", KOSPI:true, KOSDAQ:true };
let divListMode = false;               // 사이드가 '오늘의 배당공시' 목록이면 갱신 때 다시 그림
const todayISO = () => dISO(new Date());
const matchQ = e => { const q = filters.q.trim().toLowerCase(); return !q || `${e.corp}`.toLowerCase().includes(q); };
const shown = e => filters[e.market] && matchQ(e);

let _divUp = [], _divSort = {key:"ex", dir:1};   // 기본: 배당락일 오름차순(가까운 날 먼저)
function divRowsHtml(){                 // 정렬 상태(_divSort) 반영해 배당락 표 행 생성
  const arr = _divUp.slice(), k = _divSort.key, dir = _divSort.dir;
  arr.sort((a,b)=>{
    if(k==="amt"){
      const pa=(a.per_share!=null)?+a.per_share:-Infinity, pb=(b.per_share!=null)?+b.per_share:-Infinity;
      return dir*(pa-pb);
    }
    if(k==="ex") return dir*((a.ex_date||"").localeCompare(b.ex_date||""));   // ISO 날짜는 사전식=시간순
    return dir*(a.corp||"").localeCompare(b.corp||"","ko");
  });
  return arr.map(e=>{
    const amt = (e.per_share!=null)?won(e.per_share)+"원":"미정";
    return `<tr class="dor" data-url="${esc(e.url)}"><td class="nm">${esc(e.corp)}</td><td class="px">${amt}</td><td class="dt">락 ${esc((e.ex_date||"").slice(5))}</td></tr>`;
  }).join("");
}
function renderDivUpTable(){
  const tb = document.getElementById("divUpBody"); if(!tb) return;
  tb.innerHTML = divRowsHtml();
  tb.querySelectorAll("tr.dor").forEach(el=> el.addEventListener("click",()=>{
    if(el.dataset.url) window.open(el.dataset.url,"_blank","noopener");   // 클릭 → DART 원문
  }));
  document.querySelectorAll("#divUpTab th[data-sk]").forEach(th=>{
    const on = th.dataset.sk===_divSort.key, ar = th.querySelector(".ar");
    if(ar) ar.textContent = on ? (_divSort.dir>0?"▲":"▼") : "⇅";
  });
}
function sortDivUp(k){                  // 헤더 클릭 → 정렬 키/방향 토글
  if(_divSort.key===k) _divSort.dir*=-1;
  else { _divSort.key=k; _divSort.dir = (k==="amt")?-1:1; }   // 배당금은 높은순 먼저, 이름/배당락은 오름차순
  renderDivUpTable();
}
const _dpOpen = new Set();   // 펼친 카드 키 — 자동갱신 재렌더에도 펼침 유지
const DP_ST = {"확정":"ok", "금액예상":"half", "예상":"est"};
function dpHtml(){
  if(!DP || !DP.indices) return "";
  const f2 = v => Number(v||0).toFixed(2);
  const md = d => esc((d||"").slice(5));
  let h = `<div class="dp"><div class="lh">📐 지수배당포인트 · 근월물 ${md(DP.expiries?.[0])} / 차월물 ${md(DP.expiries?.[1])} 만기</div>
    <div class="dpf"><b>${esc(DP.formula)}</b><br>
      <span>= 지수 × (배당 때문에 지수가 빠지는 비율) — 지수를 곱하는 건 비율을 포인트로 바꾸기 위함<br>
      대상: ${esc(DP.rule)} · 확정=DART 배당결정, 금액예상=기준일만 공시, 예상=리서치 추정,
      <b>월물미정</b>=기준일 공고 전이라 오늘+14일(${md(DP.earliest_ex)} 배당락)부터 근월물에 들어올 수 있음</span></div>`;
  DP.indices.forEach(c=>{
    const k = "c:"+c.key;
    const lvl = c.index_close ? Number(c.index_close).toLocaleString("ko-KR",{minimumFractionDigits:2}) : "-";
    const ms = c.months || [];
    h += `<details class="dpc" data-k="${esc(k)}"${_dpOpen.has(k)?" open":""}>
      <summary><b>${esc(c.name)}</b><span class="dpt">${ms.map(m=>f2(m.total)).join(" / ")}pt</span>
        <span class="dps">${ms.map(m=>`${esc(m.label)} 확정 ${f2(m.confirmed)} · 예상 ${f2(m.estimated)} · 월물미정 ${f2(m.undecided)}`).join("<br>")}</span></summary>
      <div class="dpm">${esc(c.etf)} PDF ${esc(c.pdf_date)} · ${c.n_stocks}종목 · 지수 ${lvl} (${esc((c.index_date||"").slice(5))} 종가)${c.error?` · <span class="dperr">⚠ 오늘 수집 실패 — 직전본 사용</span>`:""}</div>`;
    ms.forEach(m=>{
      const items = m.days.flatMap(d => d.items.map(x => ({...x, ex_date:d.ex_date})));
      h += `<div class="dpm"><b>${esc(m.label)}</b> ${md(m.expiry)} 만기 — ${f2(m.total)}pt</div>`;
      if(!items.length) h += `<div class="dpm">${c.n_stocks?"이 월물 배당락 없음":"PDF 없음 — 수집 대기"}</div>`;
      else h += `<table class="dortab dpi"><thead><tr><th>종목 (${items.length})</th><th style="text-align:right">배당금</th><th style="text-align:right">배당락일</th></tr></thead><tbody>`
        + items.map(x=>`<tr class="dor" data-url="${esc(x.url||"")}" title="${esc(`${x.div_type} · 기준일 ${x.record_date}${x.basis?"\n"+x.basis:""}`)}">
            <td class="nm">${esc(x.corp)}<span class="st ${DP_ST[x.status]||"est"}">${esc(x.status)}</span>${x.undecided?`<span class="st und">월물미정</span>`:""}</td>
            <td class="px">${won(x.dps)}원</td><td class="dt">${esc(x.ex_date.slice(5))}</td></tr>`).join("")
        + `</tbody></table>`;
      if(m.undetermined.length)
        h += `<div class="dpm">금액 미정(포인트 제외): ${m.undetermined.map(u=>`${esc(u.corp)}(${esc(u.ex_date.slice(5))})`).join(", ")}</div>`;
    });
    h += `</details>`;
  });
  return h + `</div>`;

function haltEvents(){   // 거래정지 → '🚫정지 시작' + '✅거래재개' 2점 이벤트
  const out = [];
  HALT.filter(shown).forEach((e,i)=>{
    const props = {...e, kind:"halt"};
    if(e.halt_date)
      out.push({id:"hs"+i, title:`🚫 ${e.corp} 정지·${e.reason||""}`, start:e.halt_date,
                allDay:true, classNames:["halt-stop"], extendedProps:props});
    if(e.resume_date)
      out.push({id:"hr"+i, title:`✅ ${e.corp} 재개${e.resume_confirmed?"":"(예정)"}`, start:e.resume_date,
                allDay:true, classNames:["halt-resume", ...(e.resume_confirmed?[]:["halt-tent"])], extendedProps:props});

function divEvents(){

  DIV.filter(shown).forEach((e,i)=>{

              allDay:true, classNames:["dv-ex"], extendedProps:props});
  });

function capEvents(){   // 유상·무상증자 — 신주배정기준일 기준 권리락(T-1)/권리부매수(T-2)
  const out = [];
  CAP.filter(shown).forEach((e,i)=>{
    const bonus = e.type==="무상증자";
    const pre = bonus ? "무상" : "유상";
    const props = {...e, kind:"cap"};
    const even = e.ret!=null ? ` 본전 ${won(e.base_price)}·현재 ${won(e.price)} ${pctTxt(e.ret)}`
               : e.base_price ? ` 예상기준가 ${won(e.base_price)}` : "";
    if(e.buy_date||e.record_date)
      out.push({id:"cb"+i, title:`[${pre}매수일] ${e.corp}`, start:e.buy_date||e.record_date, allDay:true,
                classNames:[bonus?"cap-bonus-buy":"cap-rights-buy"], extendedProps:props});
    if(e.ex_date||e.record_date)
      out.push({id:"cx"+i, title:`[${pre}권리락] ${e.corp}${even}`, start:e.ex_date||e.record_date, allDay:true,
                classNames:[bonus?"cap-bonus-ex":"cap-rights-ex"], extendedProps:props});
    // 무상 매도 가능일(신주상장 T-2) — 잔고가 들어와 팔 수 있는 날, 엠피스 장부단가 주의
    if(e.sell_date)
      out.push({id:"cs"+i, title:`[무상매도가능] ${e.corp} ⚠엠피스 장부단가${even}`, start:e.sell_date, allDay:true,
                classNames:["cap-sell"], extendedProps:props});
    // 신주 상장(입고)일 — 무·유 공통, 항상 표시(실제 신주가 계좌에 들어오는 날)
    if(e.listing_date)
      out.push({id:"cl"+i, title:`[${pre}신주상장${bonus?"·락금액 보정":""}] ${e.corp}${bonus?even:(e.issue_ret!=null?` 발행가 ${won(e.issue_adj)}·현재 ${won(e.price)} ${pctTxt(e.issue_ret)}`:"")}`, start:e.listing_date, allDay:true,
                classNames:["cap-list"], extendedProps:props});
    // 신주인수권증서 상장(입고)일 — 유상만(서버에서 유상만 채움)
    if(e.rights_date)
      out.push({id:"cw"+i, title:`[유상신주인수권] ${e.corp}${e.even_rights!=null?` 본전 ${won(e.even_rights)}·`:" "}${e.rights_theo!=null?`이론 ${won(e.rights_theo)}`:""}`, start:e.rights_date, allDay:true,
                classNames:["cap-warrant"], extendedProps:props});
  });
  return out;
}
function estEvents(){   // 예상배당(리서치 추정) — 노란색. 실제 배당공시 나온 시즌은 숨김.
  // 실제 배당(DIV)이 이미 나온 종목·기준일(±30일)의 예상배당은 중복 → 제거 (예: 삼양식품)
  const realRec = {};
  DIV.forEach(e=>{ if(e.stock && e.record_date) (realRec[e.stock]=realRec[e.stock]||[]).push(e.record_date); });
  const dday = (a,b)=> Math.abs((new Date(a)-new Date(b))/864e5);
  const superseded = e => e.record_date && (realRec[e.stock]||[]).some(rd => dday(rd, e.record_date) <= 30);
  const out = [];
  (RES.events||[]).filter(e=> shown(e) && !superseded(e)).forEach((e,i)=>{
    const amt = `${e.corp} (예상 ${e.per_share?won(e.per_share)+"원":"미정"})`;
    const props = {...e, kind:"est"};
    out.push({id:"eb"+i, title:`💡[예상 배당매수일] ${amt}`, start:e.confirm_date||e.record_date,
              allDay:true, classNames:["est"], extendedProps:props});
    out.push({id:"ex"+i, title:`💡[예상 배당락] ${amt}`, start:e.ex_date||e.record_date,
              allDay:true, classNames:["est"], extendedProps:props});
  });
  return out;
}

const GROUP_MAX = 4;   // 월 보기에서 같은 날 같은 종류가 이보다 많으면 요약 한 줄, 목록은 상세 패널 표로 (목록 보기는 다 펼침)
const GROUP_LABEL = {eb:"💡[예상 배당매수일]", ex:"💡[예상 배당락]", vb:"[배당매수일]", vx:"[배당권리락]"};
function applyFilters(){
  const all = divEvents().concat(estEvents()).concat(capEvents()).concat(haltEvents());
  const groups = {};
  all.forEach(ev=> (groups[ev.start+"|"+ev.id.replace(/\d+$/,"")] ||= []).push(ev));
  const events = calendar.view.type.startsWith("list") ? all : Object.values(groups).flatMap(g=>{
    if(g.length <= GROUP_MAX) return g;
    const items = g.map(ev=> ev.extendedProps), kind = g[0].id.replace(/\d+$/,"");
    const label = GROUP_LABEL[kind] || g[0].title.split(" ")[0];
    const n = m => items.filter(x=> x.market===m).length;
    return [{id:"g"+kind+g[0].start, title:`${label} ${g.length}건 · 코스피 ${n("KOSPI")} / 코스닥 ${n("KOSDAQ")}`, start:g[0].start,
             allDay:true, classNames:g[0].classNames, extendedProps:{kind:"group", label, date:g[0].start, items}}];
  });
  calendar.batchRendering(()=>{
    calendar.removeAllEvents();
    calendar.addEventSource(events);
  });
}

function stageLadder(e){
  // 5단계 사다리·앵커·경고 — research.py 가 계산한 값을 그대로 그림 (예상=e.ladder, 확정=회차별 ladders)
  const c = (RES.companies||{})[e.stock] || {};
  const lad = e.kind==="est" ? e.ladder : (c.ladders||{})[`${e.div_type}|${e.record_date}`];
  if(!lad) return "";
  const dot = {on:"✅", off:"○", none:"—"};
  const rows = lad.map(s=>`<div class="st ${s.state==="on"?"":"none"}${s.n==="④"&&s.state!=="on"?" cur":""}"><span class="dot">${dot[s.state]}</span>
      <span><b>${esc(s.n)} ${esc(s.name)}</b> <span class="sub">${esc(s.text)}</span></span></div>`).join("");
  let h = `<div class="wh" style="margin-top:8px">🪜 기준일 확정 단계 <span class="sub" style="font-weight:400;color:var(--muted)">— ④부터 확정</span></div><div class="lad">${rows}</div>`;
  if(e.kind==="est"){
    const alt = Object.entries(e.alt||{}).map(([k,v])=>`${k} ${esc(v)}`).join(" · ");
    h += `<div class="anc">🧭 <b>${esc(e.method)}${e.may_change?" · 바뀔 수 있음":""}</b> — ${esc(e.why)}<br>앵커: ${esc(e.anchor)}${alt?`<br>앵커별 값: ${alt}`:""}</div>`;
    const cond = Object.entries(e.cond||{}).filter(([,v])=>v!==null).map(([k,v])=>`${k} ${v?"켜짐":"꺼짐"}`).join(" · ");
    if(cond) h += `<div class="ev">조건부 신호(적중률 측정 중, 판정엔 안 씀): ${esc(cond)}</div>`;
    h += (e.warn||[]).map(w=>`<div class="ev">⚠ ${esc(w)}</div>`).join("");
  }
  return h;
}
function companyBlock(stock){   // 이 회사의 정관·결정기관·결산월·계획·근거 (research.json)
  const c = (RES.companies||{})[stock];
  if(!c) return "";
  const ch = Object.entries(c.charter||{}).map(([g,x])=>`${g} ${x.v} <span class="sub">(${esc(x.src)})</span>`).join("<br>");
  const og = Object.entries(c.organ||{}).map(([g,v])=>`${g} ${esc(v)}`).join(" · ");
  const jd = Object.entries(c.judgments||{}).map(([t,j])=>`<div class="row">· ${esc(t)} ${esc(j.quarter)}: <b>${esc(j.method)}${j.may_change?" · 바뀔 수 있음":""}</b> <span class="sub">${esc(j.why)}</span></div>`).join("");
  let h = `<div class="why"><div class="wh">🏷️ 이 회사의 기준일 판정</div>${jd}
    <div class="row">정관(이사회 기준일 지정): ${ch||"정보 없음"}</div>
    <div class="row">배당액 결정기관: ${og||"미상"} · 결산월 ${esc(String(c.acc_mt))}월${c.acc_known?"":" (조회 실패 — 12월 가정)"}</div>`;
  if(c.charter_pending && c.charter_pending.date) h += `<div class="row">주총(${esc(c.charter_pending.date)}) 정관 기준일 변경 안건 상정 — 결과 대기</div>`;
  (c.notices||[]).forEach(n=> h += `<div class="ev">📣 ${esc(n.date)} ${esc(n.title)} → ${esc(n.quarter)} ${esc(n.div_type)}${n.hint?` (${esc(n.hint)} 이후)`:""}</div>`);
  (c.plans||[]).forEach(p=> h += `<div class="ev">📑 ${esc(p.date)} ${esc(p.title)}: ${p.lines.map(esc).join(" … ")}</div>`);
  h += (c.evidence||[]).map(x=>`<div class="ev">· ${esc(x)}</div>`).join("");
  return h + `</div>`;
}
function whyBlock(e){
  // "왜 이 날짜인가" — 파생 날짜 설명 + 5단계 사다리 + 회사 판정 + 배당 이력
  let h = `<div class="why"><div class="wh">📍 날짜 산출 근거</div>
    <div class="row">📌 <b>기준일(${esc(e.record_date)})</b> — 이날 주주명부에 올라 있어야 배당. 배당락·매수일은 여기서 자동 계산됩니다.</div>
    <div class="row">🗓️ <b>배당매수일(${esc(e.confirm_date||"-")})</b> — 기준일 T-2(국내 T+2 결제). <b>이날까지 매수</b>.</div>
    <div class="row">🚫 <b>배당락일(${esc(e.ex_date||"-")})</b> — 기준일 T-1. 이날부터 배당 없음. 현금배당은 거래소 가격조정 없이 시장에서 통상 배당액만큼 하락.</div>
    <div class="row" style="margin-top:3px;color:var(--muted)">※ 영업일: 주말·한국 공휴일·근로자의날·연말폐장 제외.</div>`;
  h += stageLadder(e);
  return h + `</div>` + companyBlock(e.stock) + divHistBlock(e.stock);
}
function divHistBlock(stock){   // 이 회사가 원래 주는 배당 — 구성(분기·결산 등) + 회차별 이력 (research.json)

}

let _group = null;   // 마지막으로 연 묶음 — 종목 상세에서 목록으로 돌아가기
const backLinks = e => `<span class="back" onclick="renderDivToday()">‹ 오늘의 배당공시</span>${_group && _group.items.includes(e) ? ` · <span class="back" onclick="showDetail(_group)">‹ ${esc(_group.label)} 목록</span>` : ""}`;
function showDetail(e){
  const box = document.getElementById("detail");
  divListMode = false; box.className = "";
  if(e.kind==="group"){
    _group = e;
    const dp = {};
    (DP?.indices||[]).forEach(c=> (c.months||[]).forEach(m=> m.days.forEach(d=> d.items.forEach(x=> dp[x.stock+"|"+d.ex_date] = x))));
    const rows = e.items.map(x=>({x, p:dp[x.stock+"|"+x.ex_date]}))
      .sort((a,b)=> (b.x.method==="유동") - (a.x.method==="유동") || (+b.x.per_share||0) - (+a.x.per_share||0));
    box.innerHTML = `<div class="detail">
        <span class="back" onclick="renderDivToday()">‹ 오늘의 배당공시</span>
        <div class="corp">${esc(e.label)} <span style="font-size:13px;color:var(--muted)">${esc(e.date)} · ${e.items.length}건</span></div>
        <div class="row" style="color:var(--muted)">유동(기준일이 바뀔 수 있음) 먼저, 그다음 금액순 · 수익률·지수pt 는 차월물 만기까지 배당락만 · 행 클릭→상세</div>
        <table class="dortab" id="grpTab"><thead><tr><th>종목</th><th style="text-align:right">금액</th><th>방식</th>
          <th style="text-align:right">수익률</th><th style="text-align:right">지수pt</th></tr></thead><tbody>${
        rows.map(({x,p})=>`<tr class="dor" data-i="${e.items.indexOf(x)}">
          <td class="nm">${esc(x.corp)} <span class="mkt ${esc(x.market)}">${esc(x.market)}</span></td>
          <td class="px">${x.per_share?won(x.per_share)+"원":"-"}</td>
          <td${x.method==="유동"?' style="color:var(--est);font-weight:700"':""}>${esc(x.method||x.div_type||x.type||"")}</td>
          <td class="px">${p?p.yield.toFixed(2)+"%":"-"}</td><td class="px">${p?p.points.toFixed(3):"-"}</td></tr>`).join("")}</tbody></table></div>`;
    box.querySelectorAll("#grpTab tr.dor").forEach(el=> el.addEventListener("click",()=> showDetail(e.items[+el.dataset.i])));
  } else if(e.kind==="est"){
    box.innerHTML = `
      <div class="detail">
        ${backLinks(e)}
        <div class="corp">💡 ${esc(e.corp)}<span class="badge ${esc(e.market)}">${esc(e.market)}</span></div>
        <div class="row">종목코드 ${esc(e.stock||"-")} · <b style="color:var(--est)">예상 ${esc(e.div_type||"배당")}</b> (리서치 추정)</div>
        <div class="big" style="color:var(--est)">${e.per_share?won(e.per_share)+"원":"금액 미정"} <span style="font-size:13px;color:var(--muted)">/주 (예상)</span></div>
        <div class="row">🗓️ 예상 배당매수일(T-2) <b style="color:var(--est)">${esc(e.confirm_date||"-")}</b></div>
        <div class="row">🚫 예상 배당락일(T-1) ${esc(e.ex_date||"-")}</div>
        <div class="row">📌 예상 배당기준일 ${esc(e.record_date)} <span style="color:var(--muted)">(${esc(e.quarter)} · 결산기말·분기말 ${esc(e.quarter_end)})</span></div>
        <div class="row">💸 예상 지급일 ${esc(e.pay_date||"-")}</div>
        <div class="why"><div class="wh">🧠 예상 배당 — 추정 근거</div>
          ${stageLadder(e)}
          <div class="ev" style="margin-top:8px">🧮 금액: ${esc(e.amount_basis||"")}</div>
          <div class="ev" style="margin-top:4px">※ 공시 기반 자동 추정 (설계: docs/배당예측-워크플로우.md). 실제 공시(④)가 나오면 빨간색(확정) 이벤트로 대체됩니다.</div>
        </div>
        ${companyBlock(e.stock)}
        ${divHistBlock(e.stock)}
      </div>`;
  } else if(e.kind==="cap"){
    const bonus = e.type==="무상증자";
    const col = bonus ? "#a855f7" : "#3b82f6";
    box.innerHTML = `
      <div class="detail">
        ${backLinks(e)}
        <div class="corp">${bonus?"🆓":"💰"} ${esc(e.corp)}<span class="badge ${esc(e.market)}">${esc(e.market)}</span></div>
        <div class="row">종목코드 ${esc(e.stock||"-")} · <b style="color:${col}">${esc(e.type)}</b>${e.ratio?` · 배정비율 ${esc(e.ratio)}`:""}</div>
        <div class="row">🗓️ 권리부매수일(T-2) <b style="color:${col}">${esc(e.buy_date||"-")}</b> <span style="color:var(--muted)">— 이날까지 사야 신주배정 권리</span></div>
        <div class="row">🚫 권리락일(T-1) <b style="color:${col}">${esc(e.ex_date||"-")}</b> <span style="color:var(--muted)">— 이날부터 권리락</span></div>
        <div class="row">📌 신주배정기준일 ${esc(e.record_date)}</div>
        ${e.ret!=null?`<div class="row">📈 본전 주가(기준가) ${won(e.base_price)}원 → 현재가 ${won(e.price)}원 · <b style="color:${e.ret>0?"#ef4444":e.ret<0?"#3b82f6":"var(--text)"}">수익률 ${pctTxt(e.ret)}</b>${bonus?"":` <span style="color:var(--muted)">(주식 + 증서 이론가)</span>`}</div>`
          : e.base_price?`<div class="row">📈 예상 권리락 기준가(이론) <b>${won(e.base_price)}원</b> <span style="color:var(--muted)">— 현재가 ${won(e.price)}원을 권리부 종가로 본 값</span></div>`:""}
        ${e.rights_theo!=null?`<div class="row">🎟️ 발행가 ${won(e.issue_adj)}원 → 증서 이론가 <b style="color:#ec4899">${won(e.rights_theo)}원</b>${e.even_rights!=null?` (본전 ${won(e.even_rights)}원)`:""} · 1주당 ${esc(e.ratio)}개 · 청약 신주 <b style="color:${e.issue_ret>0?"#ef4444":e.issue_ret<0?"#3b82f6":"var(--text)"}">발행가 대비 ${pctTxt(e.issue_ret)}</b></div>`:""}
        ${e.rights_date?`<div class="row">🎟️ 신주인수권증서 상장(입고) <b style="color:#ec4899">${esc(e.rights_date)}</b> <span style="color:var(--muted)">— 이날부터 신주인수권 거래·입고</span></div>`:""}
        ${e.sell_date?`<div class="row">🟧 매도 가능(잔고 입고) <b style="color:#f59e0b">${esc(e.sell_date)}</b> <span style="color:var(--muted)">— 신주상장 2영업일 전(T-2)부터 신주 잔고가 들어와 팔 수 있음</span></div>`:""}
        ${e.listing_date?`<div class="row">📦 신주 상장(입고) <b style="color:#10b981">${esc(e.listing_date)}</b> <span style="color:var(--muted)">— ${bonus?"신주가 상장되는 날":"실제 신주가 계좌에 들어와 거래 시작"}</span></div>`:""}
        ${bonus?`<div class="why"><div class="wh">✅ 할 일</div>
          <div class="row">1. <b>매도 가능일(${esc(e.sell_date||"-")})</b> — 신주 잔고가 들어와 팔 수 있습니다.
            <b style="color:#f59e0b">⚠ 엠피스에는 신주 잔고가 아직 반영되지 않아 장부단가가 높게 잡혀 있습니다. 이때 매도차익을 잡으면 그 손익이 빠질(잃어버릴) 수 있으니 확인하세요.</b></div>
          <div class="row">2. <b>신주 상장일(${esc(e.listing_date||"-")})</b> — 락금액을 보정합니다.</div>
          <div class="row">3. <b>지수차익 관점</b> — 권리락으로 주가가 빠졌어도 지수차익에서 그만큼 수익을 봤습니다. 락 맞은 금액이 조금 들어왔다고 손실로 생각하지 마세요.</div>
          ${(()=>{   // 1주 보유 기준: 락 금액 vs 신주로 돌아온 금액, 그 차이는 지수선물 매도가 반대로 메움
            const r = Number(e.ratio), base = e.base_price, p = e.sell_price ?? e.price;
            if(!r || !base || !p || e.ret==null) return "";
            const lock = Math.round(base*r), back = Math.round(p*r), gap = back - lock;
            const est = e.sell_price==null ? " (매도 가능일 전 — 현재가로 계산)" : "";
            const sg = n => (n>0?"+":"")+won(n);
            return `<table class="dortab" style="margin-top:6px"><thead><tr><th colspan="2">1주 보유 기준 (신주 ${esc(e.ratio)}주)${est}</th></tr></thead><tbody>
              <tr><td>락 맞은 금액 (기준가 ${won(base)} × ${esc(e.ratio)})</td><td class="px">−${won(lock)}</td></tr>
              <tr><td>신주로 돌아온 금액 (${e.sell_price==null?"현재가":"매도 가능일 종가"} ${won(p)} × ${esc(e.ratio)})</td><td class="px">+${won(back)}</td></tr>
              <tr><td>현물만 보면 (그 사이 주가 변동분)</td><td class="px" style="color:${gap>0?"#ef4444":gap<0?"#3b82f6":"inherit"}">${sg(gap)}</td></tr>
              <tr><td>지수선물 매도 (같은 변동을 반대로)</td><td class="px" style="color:${-gap>0?"#ef4444":-gap<0?"#3b82f6":"inherit"}">${sg(-gap)}</td></tr>
              <tr><td><b>지수차익 손익 (현물 + 선물)</b></td><td class="px"><b>0</b></td></tr></tbody></table>`;
          })()}
        </div>`:""}
        <div class="why"><div class="wh">📍 날짜 안내</div>
          <div class="row">📌 <b>신주배정기준일(${esc(e.record_date)})</b> — 이날 주주명부에 있어야 ${bonus?"무상":"유상"}신주를 배정받습니다.</div>
          <div class="row">🗓️ <b>권리부매수일(${esc(e.buy_date||"-")})</b> — 기준일 2영업일 전(T-2). T+2 결제라 이날까지 매수해야 권리를 받습니다.</div>
          <div class="row">🚫 <b>권리락일(${esc(e.ex_date||"-")})</b> — 기준일 1영업일 전(T-1). 이날부터 신주 권리가 없어 통상 권리락으로 주가가 조정됩니다.</div>
          <div class="row">📈 <b>권리락 기준가</b> — ${bonus
            ? "무상: 권리부 종가 ÷ (1 + 1주당 배정주식수)"
            : "유상: (권리부 종가 + 발행가 × 1주당 배정주식수) ÷ (1 + 1주당 배정주식수)"}.
            권리락 전엔 현재가로 계산한 이론값, 권리락 후엔 수정주가의 권리부매수일 종가(이후 증자까지 반영된 현재 주식 기준). 주가가 기준가면 본전.
            수익률 = ${bonus?"현재가 ÷ 기준가 − 1":"(현재가 + 1주당 배정주식수 × 증서 이론가) ÷ 권리부 매수가 − 1"}.</div>
          ${bonus?"":`<div class="row">🎟️ <b>증서 이론가</b> — 현재가 − 발행가(이후 무상증자 반영). 증서를 팔면 1주당 이 값 × 배정주식수만큼 받습니다. 청약해서 신주를 팔면 수익률 = 현재가 ÷ 발행가 − 1.</div>`}
          ${e.rights_date?`<div class="row">🎟️ <b>신주인수권증서 상장(${esc(e.rights_date)})</b> — 유상 주주배정 시 신주인수권증서가 상장·거래(입고)되는 시작일. 청약 안 할 거면 이 기간에 매도 가능.</div>`:""}
          ${e.listing_date?`<div class="row">📦 <b>신주 상장(${esc(e.listing_date)})</b> — 청약·배정받은 신주가 실제 계좌에 입고돼 거래를 시작하는 날.</div>`:""}
        </div>
        <a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">🔗 DART 원문 보기</a>
      </div>`;
  } else if(e.kind==="halt"){
    const conf = e.resume_confirmed;
    box.innerHTML = `
      <div class="detail">
        <div class="corp">🚫 ${esc(e.corp)}<span class="badge ${esc(e.market)}">${esc(e.market)}</span></div>
        <div class="row">종목코드 ${esc(e.code||"-")} · <b style="color:#ef4444">매매거래정지</b></div>
        <div class="row">📄 사유 <b>${esc(e.reason||"-")}</b>${e.reason_full?` <span style="color:var(--muted)">(${esc(e.reason_full)})</span>`:""}</div>
        <div class="row">🚫 정지 시작 <b style="color:#ef4444">${esc(e.halt_date||"-")}</b></div>
        <div class="row">✅ 거래 재개 <b style="color:${conf?"#10b981":"#f59e0b"}">${esc(e.resume_date||"미정")}</b> <span style="color:var(--muted)">${e.resume_date?(conf?"(확정)":"(예정 — 확정 시 갱신)"):"(거래소 재개공시 대기)"}</span></div>
        <div class="why"><div class="wh">📍 안내</div>
          <div class="row">🚫 <b>정지 시작(${esc(e.halt_date||"-")})</b> — 이날부터 해당 종목 매매가 정지됩니다.</div>
          <div class="row">✅ <b>거래 재개(${esc(e.resume_date||"미정")})</b> — ${conf?"거래소 확정일":"원본 결정공시의 상장예정일 기준 <b>예정</b>. 거래소 재개공시가 나오면 확정일로 자동 교체됩니다."}</div>
          <div class="ev" style="margin-top:8px">※ 출처: 한국거래소(KIND) 매매거래정지 공시${conf?"":" + DART 결정공시(상장예정일)"}. 주식분할·병합·감자 등은 신주 변경상장일에 거래가 재개됩니다.</div>
        </div>
        <a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">🔗 KIND 공시 원문 보기</a>
      </div>`;
  } else {
    box.innerHTML = `
      <div class="detail">
        ${backLinks(e)}
        <div class="corp">${esc(e.corp)}<span class="badge ${esc(e.market)}">${esc(e.market)}</span></div>
        <div class="row">종목코드 ${esc(e.stock||"-")} · <b style="color:var(--div)">${esc(e.div_type||"배당")}</b></div>
        <div class="big">${e.per_share?won(e.per_share)+"원":"금액 미정"} <span style="font-size:13px;color:var(--muted)">/주</span></div>
        <div class="row">🗓️ 배당매수일(T-2) <b style="color:var(--accent)">${esc(e.confirm_date||"-")}</b></div>
        <div class="row">🚫 배당락일(T-1) <b style="color:var(--exp)">${esc(e.ex_date||"-")}</b></div>
        <div class="row">📌 배당기준일 ${esc(e.record_date)}</div>
        <div class="row">💸 지급예정일 ${esc(e.pay_date||"-")}</div>
        ${whyBlock(e)}
        <a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">🔗 DART 원문 보기</a>
      </div>`;
  }
}

async function getJSON(name){ return (await fetch(`${DATA}${name}?_=${Date.now()}`)).json(); }
async function loadData(){
  const d = await getJSON("dividends.json");
  DIV = d.events||[];
  try{ CAP = (await getJSON("capital.json")).events||[]; }catch(_){ CAP = []; }
  try{ RES = await getJSON("research.json"); }catch(_){}
  try{ HALT = (await getJSON("halts.json")).events||[]; }catch(_){ HALT = []; }
  try{ DP = await getJSON("divpoints.json"); }catch(_){ DP = null; }
  document.getElementById("meta").textContent =
    `💰 배당 ${d.count} · 💡예상 ${RES.count||0} · 📈 증자 ${CAP.length} · 🚫 정지 ${HALT.length}`;
  applyFilters();
  if(divListMode) renderDivToday();
}
function refresh(){   // 다시 그려도 보던 스크롤 위치 유지
  const els = [document.scrollingElement, ...document.querySelectorAll("*")].filter(el=> el.scrollTop > 0);
  const ys = els.map(el=> el.scrollTop);
  return loadData().catch(console.error).finally(()=> els.forEach((el,i)=> el.scrollTop = ys[i]));
}

async function boot(){
  // 만기일·휴장일 먼저 로드 — 캘린더 render 전에 HOL 을 채워야 휴일 빨간색이 첫 렌더부터 적용됨
  try{ const ex = await getJSON("expiries.json");
       EXP = ex.events||[]; HOL = new Set(ex.holidays||[]); EXPD = new Set(EXP.map(e=>e.date)); }catch(_){}
  let viewType = "list3m";
  calendar = new FullCalendar.Calendar(document.getElementById("calendar"),{
    initialView:viewType, locale:"ko", height:"100%", firstDay:0, dayMaxEvents:6,
    showNonCurrentDates:false, fixedWeekCount:false,   // 전월·다음월 날짜 숨김 + 여분 주 제거
    headerToolbar:{left:"prev,next today",center:"title",right:"list3m,dayGridMonth"},
    buttonText:{today:"오늘",month:"월"},
    views:{list3m:{type:"list", duration:{months:3}, dateAlignment:"day", buttonText:"날짜별 목록"}},   // 오늘부터 3개월
    allDayText:"",
    dayCellClassNames:(a)=>{ const iso=dISO(a.date), c=[]; if(HOL.has(iso))c.push("holiday"); if(EXPD.has(iso))c.push("expday"); return c; },   // 휴장일 빨간글자·만기일 별표
    datesSet:(info)=>{ if(info.view.type!==viewType){ viewType = info.view.type; applyFilters(); } },   // 월 보기는 묶음, 목록은 다 펼침
    eventClick:(info)=>{ info.jsEvent.preventDefault(); const p=info.event.extendedProps; showDetail(p); if(info.jsEvent.detail>=2) openChart(p.stock||p.code); },   // 단일=상세 / 더블=차트
  });
  calendar.render();
  await loadData();
  renderDivToday();
  setInterval(refresh, 30000);   // 30초마다 데이터 다시 읽기
}

document.getElementById("q").addEventListener("input",e=>{ filters.q=e.target.value; applyFilters(); });
document.querySelectorAll(".chip[data-market]").forEach(c=> c.addEventListener("click",()=>{
  const mk=c.dataset.market; filters[mk]=!filters[mk];
  c.classList.toggle("on",filters[mk]); applyFilters();
  if(divListMode) renderDivToday();
}));

boot().catch(err=>{
  document.getElementById("meta").textContent = "데이터 로드 실패: "+err.message;
  console.error(err);
});
</script>
</body>
</html>
