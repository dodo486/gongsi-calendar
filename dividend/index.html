<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 배당·증자 캘린더</title>
<script src="../common/vendor/fullcalendar.min.js"></script>
<script src="../common/common.js"></script>
<script src="../common/vendor/xlsx.style.min.js"></script>
<link rel="stylesheet" href="../common/common.css">
<style>
  .dortab{width:100%;border-collapse:collapse;font-size:13px}
  .dortab th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .dortab th[data-sk]:hover{color:var(--div)}
  .dortab th .ar{font-size:10px;color:var(--muted)}
  .dortab td{padding:6px 8px;border-bottom:1px solid var(--line)}
  .dortab tr.dor{cursor:pointer}
  .dortab tr.dor:hover td{background:var(--bg)}
  .dortab td.nm{font-weight:600}
  .dortab td.px{text-align:right;color:var(--muted);white-space:nowrap}
  .dortab td.dt{text-align:right;color:var(--muted);font-size:11px;white-space:nowrap}
  .cal-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .cal-bar-lbl{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
  .cal-legend{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .cal-legend .lg{display:inline-flex;align-items:center;gap:3px}
  .cal-legend .lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .divlist .lh{font-size:13px;font-weight:700;margin-bottom:10px}
  .divlist .di{padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;background:var(--bg)}
  .divlist .di:hover{border-color:var(--div)}
  .divlist .di b{font-size:14px}
  .divlist .di .sub{font-size:12px;color:var(--muted)}
  .divlist .mkt{font-size:10px;padding:1px 6px;border-radius:5px;margin-left:4px}
  #dayList .mkt{font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;margin-right:4px}
  #dayList .mkt.KOSPI{background:#1d4ed8;color:#fff}
  #dayList .mkt.KOSDAQ{background:#f59e0b;color:#1a1200}
  .mkt.KOSPI{background:rgba(59,130,246,.2);color:#93c5fd}
  .mkt.KOSDAQ{background:rgba(245,158,11,.2);color:#fcd34d}
  .back{display:inline-block;margin-bottom:10px;color:var(--div);cursor:pointer;font-size:13px}
  /* 지수배당포인트 (사이드 상단) — 지수 카드(접기) > 포함 종목·배당금·배당락일 */
  .dp{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .dp .lh{font-size:13px;font-weight:700;margin-bottom:8px}
  .dpf{font-size:12px;line-height:1.55;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px}
  .dpf span{color:var(--muted);font-size:11px}
  .dpc{border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--bg)}
  .dpc>summary{cursor:pointer;padding:9px 10px;list-style-position:inside;font-size:14px}
  .dpc>summary .dpt{float:right;font-weight:800;color:var(--div)}
  .dpc>summary .dps{display:block;font-size:11px;color:var(--muted);margin-top:2px;padding-left:14px}
  .dpc[open]>summary{border-bottom:1px solid var(--line)}
  .dpm{font-size:11px;color:var(--muted);padding:6px 10px}
  .dperr{color:#f87171}
  .dpi{font-size:12px;margin:0 0 4px}
  .dpi td{padding:4px 8px}
  .dpi th{cursor:default}
  .st{font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;margin-left:3px}
  .st.ok{background:rgba(34,197,94,.18);color:#86efac}
  .st.half{background:rgba(59,130,246,.18);color:#93c5fd}
  .st.est{background:rgba(234,179,8,.18);color:#fde047}
  .st.und{background:rgba(239,68,68,.16);color:#fca5a5}
  /* 기준일 확정 5단계 사다리 */
  .lad{margin:6px 0 2px;display:flex;flex-direction:column;gap:3px}
  .lad .st{display:flex;align-items:flex-start;gap:7px;font-size:12px;line-height:1.45;padding:2px 5px;border-radius:5px}
  .lad .st .dot{flex:none;width:15px;text-align:center}
  .lad .st.none{color:var(--muted)}
  .lad .st.cur{background:rgba(234,179,8,.13);outline:1px solid rgba(234,179,8,.35)}
  .lad .st b{font-weight:700}
  .lad .st .sub{color:var(--muted);font-weight:400}
  .anc{font-size:12.5px;margin:6px 0 2px;padding:6px 8px;border-radius:6px;background:rgba(124,197,255,.08);border:1px solid rgba(124,197,255,.25)}
  /* 월 캘린더 + 아래 선택한 날짜 목록 */
  .cal-scroll{flex:1;min-height:0;overflow:auto}
  .cal-scroll #calendar{flex:none;overflow:visible;padding-bottom:4px}
  .fc .fc-daygrid-day{cursor:pointer}
  .fc .fc-daygrid-day.sel{background:rgba(34,197,94,.10);box-shadow:inset 0 0 0 2px var(--accent)}
  .day-h{padding:8px 14px 6px;font-weight:700;font-size:14px;border-top:1px solid var(--line)}
  #dayList{padding:0 14px 14px}
  .grade{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:rgba(234,179,8,.18);color:#fde047;white-space:nowrap}
  .chip.xlsx{color:#04240f;background:var(--accent);border-color:var(--accent);font-weight:700}
  .show-pick{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--text)}
  .show-pick label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;white-space:nowrap}
  .show-pick input{margin:0;accent-color:var(--accent);cursor:pointer}
  /* 무상증자 — 권리락(T-1) 보라 / 권리부매수(T-2) 연보라 */
  .fc-event.cap-bonus-ex{background:#a855f7;border-color:#a855f7;font-weight:600}
  .fc-event.cap-bonus-buy{background:#c4b5fd;border-color:#c4b5fd;color:#1a1030;font-weight:600}
  /* 유상증자 — 권리락(T-1) 파랑 / 권리부매수(T-2) 하늘 */
  .fc-event.cap-rights-ex{background:#3b82f6;border-color:#3b82f6;font-weight:600}
  .fc-event.cap-rights-buy{background:#7dd3fc;border-color:#7dd3fc;color:#04222a;font-weight:600}
  /* 신주 상장(입고)일 — 무·유 공통 초록 / 유상 신주인수권증서 상장(입고)일 핑크 */
  .fc-event.cap-list{background:#10b981;border-color:#10b981;color:#022c22;font-weight:700}
  .fc-event.cap-warrant{background:#ec4899;border-color:#ec4899;color:#2a0716;font-weight:700}
  /* 무상 매도 가능일(신주상장 T-2, 잔고 입고) — 주황 */
  .fc-event.cap-sell{background:#f59e0b;border-color:#f59e0b;color:#2a1700;font-weight:700}
  /* 거래정지 — 정지 시작(진회색) / 거래재개 초록, 예정이면 점선 테두리 */
  .fc-event.halt-stop{background:#4b5563;border-color:#374151;color:#f3f4f6;font-weight:700}
  .fc-event.halt-resume{background:#10b981;border-color:#10b981;color:#022c22;font-weight:700}
  .fc-event.halt-tent{background:transparent;border:1.5px dashed #10b981;color:#10b981}
  /* 목록 보기 — 하루치 안에서 색 띠가 이어 보이지 않게 행 배경은 그대로, 점만 색 */
  .fc-list-event td{background:transparent!important}
</style>
</head>
<body>
<header>
  <h1>💰 배당·증자</h1>
  <span class="meta" id="meta">불러오는 중…</span>
  <div class="controls">
    <input type="search" id="q" placeholder="회사명 검색">
    <span class="chip kospi on" data-market="KOSPI">KOSPI</span>
    <span class="chip kosdaq on" data-market="KOSDAQ">KOSDAQ</span>
    <span class="chip xlsx" id="xlsxBtn" title="캘린더에 보고 있는 달 1일부터 그 이후 배당(확정·예상)을 엑셀로 — 검색·시장 필터 반영">📥 엑셀</span>
  </div>
</header>
<div class="cal-row">
  <div class="cal-col">
    <div class="cal-bar">
      <span class="cal-bar-lbl">💰 배당·증자·거래정지 일정</span>
      <span class="show-pick" title="배당·증자의 매수일(T-2) / 락일(T-1) 중 볼 것">
        <label><input type="checkbox" id="showBuy" checked> 매수일(T-2)</label>
        <label><input type="checkbox" id="showEx" checked> 락일(T-1)</label>
      </span>
      <span class="cal-legend">
        <span class="lg" title="배당 구분 — 진할수록 날짜가 확실">배당: <span id="estLegend"></span></span>
        <span class="lg"><i style="background:#a855f7"></i><i style="background:#c4b5fd"></i> 무상</span>
        <span class="lg"><i style="background:#3b82f6"></i><i style="background:#7dd3fc"></i> 유상</span>
        <span class="lg"><i style="background:#f59e0b"></i> 무상 매도가능(잔고 입고)</span>
        <span class="lg"><i style="background:#10b981"></i> 신주상장(입고)·거래재개</span>
        <span class="lg"><i style="background:#ec4899"></i> 신주인수권(유상)</span>
        <span class="lg"><i style="background:#4b5563"></i> 거래정지</span>
        <span>· 진한색=권리락(T-1), 연한색=매수일(T-2)</span>
      </span>
    </div>
    <div class="cal-scroll">
      <div id="calendar"></div>
      <div class="day-h" id="dayHead"></div>
      <div id="dayList"></div>
    </div>
  </div>
  <div id="side">
    <h2>오늘의 배당공시</h2>
    <div id="detail" class="empty">캘린더에서 항목을 클릭하면 여기에 내용이 표시됩니다.</div>
  </div>
</div>
<script>
// 배당 페이지 = 이 폴더 + common/ — 데이터는 DATA 아래 DATA_FILES 만 읽는다(따로 배포할 때 이 파일들만 같이 올림)
const DATA = "../data/";
const DATA_FILES = ["div_book.json","div_sources.json","capital.json","research.json","halts.json","divpoints.json","expiries.json","dividend_check.json"];
let BOOK = {rows:[], grades:{}}, ROWS = [], SRC = {rows:[]}, CAP = [], HALT = [], EXP = [];
let RES = {companies:{}, events:[]};   // 리서치: 기준일 판정 + 예상배당(research.json)
let DP = null;                         // 지수배당포인트(divpoints.json)
let HOL = new Set(), EXPD = new Set(); // 휴장일·만기일 ISO 날짜 — 캘린더 날짜 빨간 글자·노란 별표
let calendar, dayCal;                  // 위: 월 캘린더(같은 날 같은 종류 많으면 묶음) / 아래: 선택한 날짜 목록(다 펼침)
let selDate = dISO(new Date());
const filters = { q:"", KOSPI:true, KOSDAQ:true };
let divListMode = false;               // 사이드가 '오늘의 배당공시' 목록이면 갱신 때 다시 그림
const todayISO = () => dISO(new Date());
const matchQ = e => { const q = filters.q.trim().toLowerCase(); return !q || `${e.corp}`.toLowerCase().includes(q); };
const shown = e => filters[e.market] && matchQ(e);
const show = {buy:true, ex:true};      // 매수일(T-2)·락일(T-1) 중 무엇을 볼지 — 배당·예상배당·증자 공통
try{ Object.assign(show, JSON.parse(localStorage.getItem("div.show") || "{}")); }catch(_){}

const ALT_TXT = {A1:"작년 날짜 반복", A2:"올해 주총·실적발표 기준"};
const COND_TXT = {D13:"결산기말 전 한 달에 주총용 명부폐쇄만 있음", D14:"결산기말 전 한 달에 배당 기준일 공고 없음"};
const CH_TXT = {O:"이사회가 기준일을 따로 정할 수 있음", X:"기준일이 결산기말로 고정"};

let _divUp = [], _divSort = {key:"ex", dir:1};   // 기본: 배당락일 오름차순(가까운 날 먼저)
function divRowsHtml(){                 // 정렬 상태(_divSort) 반영해 배당락 표 행 생성
  const arr = _divUp.slice(), k = _divSort.key, dir = _divSort.dir;
  arr.sort((a,b)=>{
    if(k==="amt"){
      const pa=(a.per_share!=null)?+a.per_share:-Infinity, pb=(b.per_share!=null)?+b.per_share:-Infinity;
      return dir*(pa-pb);
    }
    if(k==="ex") return dir*((a.ex_date||"").localeCompare(b.ex_date||""));   // ISO 날짜는 사전식=시간순
    return dir*(a.corp||"").localeCompare(b.corp||"","ko");
  });
  return arr.map(e=>{
    const amt = (e.per_share!=null)?won(e.per_share)+"원":"미정";
    return `<tr class="dor" data-url="${esc(e.url)}"><td class="nm">${esc(e.corp)}</td><td class="px">${amt}</td><td class="dt">락 ${esc((e.ex_date||"").slice(5))}</td></tr>`;
  }).join("");
}
function renderDivUpTable(){
  const tb = document.getElementById("divUpBody"); if(!tb) return;
  tb.innerHTML = divRowsHtml();
  tb.querySelectorAll("tr.dor").forEach(el=> el.addEventListener("click",()=>{
    if(el.dataset.url) window.open(el.dataset.url,"_blank","noopener");   // 클릭 → DART 원문
  }));
  document.querySelectorAll("#divUpTab th[data-sk]").forEach(th=>{
    const on = th.dataset.sk===_divSort.key, ar = th.querySelector(".ar");
    if(ar) ar.textContent = on ? (_divSort.dir>0?"▲":"▼") : "⇅";
  });
}
function sortDivUp(k){                  // 헤더 클릭 → 정렬 키/방향 토글
  if(_divSort.key===k) _divSort.dir*=-1;
  else { _divSort.key=k; _divSort.dir = (k==="amt")?-1:1; }   // 배당금은 높은순 먼저, 이름/배당락은 오름차순
  renderDivUpTable();
}
const _dpOpen = new Set();   // 펼친 카드 키 — 자동갱신 재렌더에도 펼침 유지
const DP_ST = {"확정":"ok", "금액예상":"half", "예상":"est"};
function dpHtml(){
  if(!DP || !DP.indices) return "";
  const f2 = v => Number(v||0).toFixed(2);
  const md = d => esc((d||"").slice(5));
  let h = `<div class="dp"><div class="lh">📐 지수배당포인트 · 근월물 ${md(DP.expiries?.[0])} / 차월물 ${md(DP.expiries?.[1])} 만기</div>
    <div class="dpf"><b>${esc(DP.formula)}</b><br>
      <span>= 지수 × (배당 때문에 지수가 빠지는 비율) — 지수를 곱하는 건 비율을 포인트로 바꾸기 위함<br>
      대상: ${esc(DP.rule)} · 확정=DART 배당결정, 금액예상=기준일만 공시, 예상=리서치 추정,
      <b>월물미정</b>=기준일 공고 전이라 오늘+14일(${md(DP.earliest_ex)} 배당락)부터 근월물에 들어올 수 있음</span></div>`;
  DP.indices.forEach(c=>{
    const k = "c:"+c.key;
    const lvl = c.index_close ? Number(c.index_close).toLocaleString("ko-KR",{minimumFractionDigits:2}) : "-";
    const ms = c.months || [];
    h += `<details class="dpc" data-k="${esc(k)}"${_dpOpen.has(k)?" open":""}>
      <summary><b>${esc(c.name)}</b><span class="dpt">${ms.map(m=>f2(m.total)).join(" / ")}pt</span>
        <span class="dps">${ms.map(m=>`${esc(m.label)} 확정 ${f2(m.confirmed)} · 예상 ${f2(m.estimated)} · 월물미정 ${f2(m.undecided)}`).join("<br>")}</span></summary>
      <div class="dpm">${esc(c.etf)} PDF ${esc(c.pdf_date)} · ${c.n_stocks}종목 · 지수 ${lvl} (${esc((c.index_date||"").slice(5))} 종가)${c.error?` · <span class="dperr">⚠ 오늘 수집 실패 — 직전본 사용</span>`:""}</div>`;
    ms.forEach(m=>{
      const items = m.days.flatMap(d => d.items.map(x => ({...x, ex_date:d.ex_date})));
      h += `<div class="dpm"><b>${esc(m.label)}</b> ${md(m.expiry)} 만기 — ${f2(m.total)}pt</div>`;
      if(!items.length) h += `<div class="dpm">${c.n_stocks?"이 월물 배당락 없음":"PDF 없음 — 수집 대기"}</div>`;
      else h += `<table class="dortab dpi"><thead><tr><th>종목 (${items.length})</th><th style="text-align:right">배당금</th><th style="text-align:right">배당락일</th></tr></thead><tbody>`
        + items.map(x=>`<tr class="dor" data-url="${esc(x.url||"")}" title="${esc(`${x.div_type} · 기준일 ${x.record_date}${x.basis?"\n"+x.basis:""}`)}">
            <td class="nm">${esc(x.corp)}<span class="st ${DP_ST[x.status]||"est"}">${esc(x.status)}</span>${x.undecided?`<span class="st und">월물미정</span>`:""}</td>
            <td class="px">${won(x.dps)}원</td><td class="dt">${esc(x.ex_date.slice(5))}</td></tr>`).join("")
        + `</tbody></table>`;
      if(m.undetermined.length)
        h += `<div class="dpm">금액 미정(포인트 제외): ${m.undetermined.map(u=>`${esc(u.corp)}(${esc(u.ex_date.slice(5))})`).join(", ")}</div>`;
    });
    h += `</details>`;
  });
  return h + `</div>`;
}
function bindDp(box){
  box.querySelectorAll(".dp details[data-k]").forEach(el=> el.addEventListener("toggle",()=>{
    el.open ? _dpOpen.add(el.dataset.k) : _dpOpen.delete(el.dataset.k);
  }));
  box.querySelectorAll(".dpi tr.dor").forEach(el=> el.addEventListener("click",()=>{
    if(el.dataset.url) window.open(el.dataset.url,"_blank","noopener");   // 확정 → DART 원문 (예상은 원문 없음)
  }));
}
function renderDivToday(){
  divListMode = true;
  const box = document.getElementById("detail"); box.className = "";
  const ti = todayISO();
  // 상단: 오늘 뜬 배당공시 (접수일=오늘)
  const byId = Object.fromEntries(ROWS.map(r=> [r.id, r]));
  const list = BOOK.today_ids.map(id=> byId[id]).filter(e=> filters[e.market]);
  let h = dpHtml() + `<div class="divlist"><div class="lh">📢 오늘 뜬 배당공시 (${list.length})</div>`;
  if(!list.length) h += `<div class="empty">오늘 접수된 배당 공시가 없습니다.</div>`;
  list.forEach(e=>{
    h += `<div class="di" data-id="${esc(e.id)}"><b>${esc(e.corp)}</b><span class="mkt ${esc(e.market)}">${esc(e.market)}</span><br>
      <span class="sub">${esc(e.div_type||"배당")} · ${e.per_share?won(e.per_share)+"원":"금액 미정"} · 매수 ${esc(e.confirm_date||"-")} · 락 ${esc(e.ex_date||"-")} · 기준 ${esc(e.record_date)}</span></div>`;
  });
  h += `</div>`;
  // 중간: 진행 중인 유·무상증자 (남은 일정이 있는 건) — 다음 일정순, 행 클릭→상세
  const capNow = CAP.filter(e=> filters[e.market]).map(e=>({e,
      next: [["매수일",e.buy_date],["권리락",e.ex_date],["증서상장",e.rights_date],["매도가능",e.sell_date],["신주상장",e.listing_date]]
              .filter(([,d])=> d && d>=ti).sort((a,b)=>a[1].localeCompare(b[1]))[0]}))
    .filter(x=> x.next).sort((a,b)=> a.next[1].localeCompare(b.next[1]));
  h += `<div class="divlist" style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px">
    <div class="lh">📈 진행 중인 유·무상증자 (${capNow.length}) <span style="font-weight:400;color:var(--muted);font-size:11px">· 행 클릭→상세</span></div>`;
  if(!capNow.length) h += `<div class="empty">해당 없음</div>`;
  else h += `<table class="dortab" id="capTab"><thead><tr><th>종목</th><th>다음 일정</th><th>본전</th><th>현재</th><th>수익률</th></tr></thead><tbody>${
    capNow.map(({e,next})=>{
      const bonus = e.type==="무상증자";
      return `<tr class="dor" data-rc="${esc(e.rcept_no)}" data-ty="${esc(e.type)}">
        <td class="nm">${esc(e.corp)} <span style="font-size:10px;font-weight:700;color:${bonus?"#a855f7":"#3b82f6"}">${bonus?"무상":"유상"}</span></td>
        <td>${esc(next[1].slice(5))} ${esc(next[0])}</td>
        <td class="px">${e.base_price?won(e.base_price)+(e.ret==null?" (예상)":""):"-"}</td>
        <td class="px">${e.price?won(e.price):"-"}</td>
        <td class="px" style="font-weight:700;color:${e.ret>0?"#ef4444":e.ret<0?"#3b82f6":"var(--muted)"}">${e.ret!=null?pctTxt(e.ret):"-"}</td></tr>`;
    }).join("")}</tbody></table>`;
  h += `</div>`;
  // 하단: 다음 만기 전까지 배당락 리스트 (종목명·현재가, 클릭→DART)
  const nextExp = BOOK.next_expiry;
  _divUp = BOOK.upcoming_ids.map(id=> byId[id]).filter(e=> filters[e.market]);
  h += `<div class="divlist" style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px">
    <div class="lh">🗓️ 다음 만기${nextExp?`(${esc(nextExp.slice(5))})`:""} 전 배당락 (${_divUp.length}) <span style="font-weight:400;color:var(--muted);font-size:11px">· 헤더 클릭 정렬 · 행 클릭→DART</span></div>`;
  if(!_divUp.length) h += `<div class="empty">해당 없음</div>`;
  else h += `<table class="dortab" id="divUpTab"><thead><tr>
      <th data-sk="name" onclick="sortDivUp('name')">종목명 <span class="ar">⇅</span></th>
      <th data-sk="amt" onclick="sortDivUp('amt')">배당금 <span class="ar">⇅</span></th>
      <th data-sk="ex" onclick="sortDivUp('ex')">배당락 <span class="ar">⇅</span></th></tr></thead><tbody id="divUpBody"></tbody></table>`;
  h += `</div>`;
  box.innerHTML = h;
  bindDp(box);
  box.querySelectorAll(".di").forEach(el=> el.addEventListener("click",()=>{
    showDetail(byId[el.dataset.id]);
  }));
  box.querySelectorAll("#capTab tr.dor").forEach(el=> el.addEventListener("click",()=>{
    const e = CAP.find(x=>x.rcept_no===el.dataset.rc && x.type===el.dataset.ty); if(e) showDetail({...e, kind:"cap"});
  }));
  renderDivUpTable();
}

function haltEvents(){   // 거래정지 → '🚫정지 시작' + '✅거래재개' 2점 이벤트
  const out = [];
  HALT.filter(shown).forEach((e,i)=>{
    const props = {...e, kind:"halt"};
    if(e.halt_date)
      out.push({id:"hs"+i, title:`🚫 ${e.corp} 정지·${e.reason||""}`, start:e.halt_date,
                allDay:true, classNames:["halt-stop"], extendedProps:props});
    if(e.resume_date)
      out.push({id:"hr"+i, title:`✅ ${e.corp} 재개${e.resume_confirmed?"":"(예정)"}`, start:e.resume_date,
                allDay:true, classNames:["halt-resume", ...(e.resume_confirmed?[]:["halt-tent"])], extendedProps:props});
  });
  return out;
}
function bookEvents(){   // 배당 — 장부의 회차별 표시(날짜·제목·묶음·색)를 그대로
  return ROWS.filter(shown).flatMap((r,i)=> r.marks.filter(m=> show[m.type]).map(m=>
    ({id:`b${m.type}${i}`, title:m.title, start:m.date, allDay:true, group:m.group,
      extendedProps:{...r, _style:BOOK.grades[r.grade].style[m.type]}})));
}
function capEvents(){   // 유상·무상증자 — 신주배정기준일 기준 권리락(T-1)/권리부매수(T-2)
  const out = [];
  CAP.filter(shown).forEach((e,i)=>{
    const bonus = e.type==="무상증자";
    const pre = bonus ? "무상" : "유상";
    const props = {...e, kind:"cap"};
    const even = e.ret!=null ? ` 본전 ${won(e.base_price)}·현재 ${won(e.price)} ${pctTxt(e.ret)}`
               : e.base_price ? ` 예상기준가 ${won(e.base_price)}` : "";
    if(show.buy && (e.buy_date||e.record_date))
      out.push({id:"cb"+i, title:`[${pre}매수일] ${e.corp}`, start:e.buy_date||e.record_date, allDay:true,
                classNames:[bonus?"cap-bonus-buy":"cap-rights-buy"], extendedProps:props});
    if(show.ex && (e.ex_date||e.record_date))
      out.push({id:"cx"+i, title:`[${pre}권리락] ${e.corp}${even}`, start:e.ex_date||e.record_date, allDay:true,
                classNames:[bonus?"cap-bonus-ex":"cap-rights-ex"], extendedProps:props});
    // 무상 매도 가능일(신주상장 T-2) — 잔고가 들어와 팔 수 있는 날, 엠피스 장부단가 주의
    if(e.sell_date)
      out.push({id:"cs"+i, title:`[무상매도가능] ${e.corp} ⚠엠피스 장부단가${even}`, start:e.sell_date, allDay:true,
                classNames:["cap-sell"], extendedProps:props});
    // 신주 상장(입고)일 — 무·유 공통, 항상 표시(실제 신주가 계좌에 들어오는 날)
    if(e.listing_date)
      out.push({id:"cl"+i, title:`[${pre}신주상장${bonus?"·락금액 보정":""}] ${e.corp}${bonus?even:(e.issue_ret!=null?` 발행가 ${won(e.issue_adj)}·현재 ${won(e.price)} ${pctTxt(e.issue_ret)}`:"")}`, start:e.listing_date, allDay:true,
                classNames:["cap-list"], extendedProps:props});
    // 신주인수권증서 상장(입고)일 — 유상만(서버에서 유상만 채움)
    if(e.rights_date)
      out.push({id:"cw"+i, title:`[유상신주인수권] ${e.corp}${e.even_rights!=null?` 본전 ${won(e.even_rights)}·`:" "}${e.rights_theo!=null?`이론 ${won(e.rights_theo)}`:""}`, start:e.rights_date, allDay:true,
                classNames:["cap-warrant"], extendedProps:props});
  });
  return out;
}
const GROUP_MAX = 4;   // 월 캘린더에서 같은 날 같은 종류가 이보다 많으면 요약 한 줄 (아래 날짜 목록은 다 펼침)
function applyFilters(){
  const all = bookEvents().concat(capEvents()).concat(haltEvents());
  const groups = {};
  all.forEach(ev=> (groups[ev.start+"|"+(ev.group || ev.id.replace(/\d+$/,""))] ||= []).push(ev));
  const events = Object.values(groups).flatMap(g=>{
    if(g.length <= GROUP_MAX) return g;
    const items = g.map(ev=> ev.extendedProps), kind = g[0].id.replace(/\d+$/,"");
    const label = g[0].group || g[0].title.split(" ")[0];
    const n = m => items.filter(x=> x.market===m).length;
    return [{id:"g"+kind+g[0].start, title:`${label} ${g.length}건 · 코스피 ${n("KOSPI")} / 코스닥 ${n("KOSDAQ")}`, start:g[0].start,
             allDay:true, classNames:g[0].classNames, extendedProps:{kind:"group", label, date:g[0].start, items, _style:items[0]._style}}];
  });
  calendar.batchRendering(()=>{
    calendar.removeAllEvents();
    calendar.addEventSource(events);
  });
  dayCal.batchRendering(()=>{
    dayCal.removeAllEvents();
    dayCal.addEventSource(all);
  });
  dayHeader();
}

function dayHeader(){
  const n = dayCal.getEvents().filter(ev=> dISO(ev.start)===selDate).length;
  const d = new Date(selDate+"T00:00:00");
  document.getElementById("dayHead").textContent =
    `📅 ${d.getMonth()+1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]}) 일정 ${n}건 · 캘린더에서 날짜를 누르면 바뀝니다`;
}
function markSel(){
  document.querySelectorAll(".fc-daygrid-day[data-date]").forEach(el=> el.classList.toggle("sel", el.dataset.date===selDate));
}
function selectDate(iso){
  selDate = iso;
  markSel();
  dayCal.gotoDate(iso);
  dayHeader();
}

function stageLadder(e){
  // 5단계 사다리·앵커·경고 — research.py 가 계산한 값을 그대로 그림 (예상=e.ladder, 확정=회차별 ladders)
  const c = (RES.companies||{})[e.stock] || {};
  const lad = e.kind==="est" ? e.ladder : (c.ladders||{})[`${e.div_type}|${e.record_date}`];
  if(!lad) return "";
  const dot = {on:"✅", off:"○", none:"—"};
  const rows = lad.map(s=>`<div class="st ${s.state==="on"?"":"none"}${s.n==="④"&&s.state!=="on"?" cur":""}"><span class="dot">${dot[s.state]}</span>
      <span><b>${esc(s.n)} ${esc(s.name)}</b> <span class="sub">${esc(s.text)}</span></span></div>`).join("");
  let h = `<div class="wh" style="margin-top:8px">🪜 기준일 확정 단계 <span class="sub" style="font-weight:400;color:var(--muted)">— ④부터 확정</span></div><div class="lad">${rows}</div>`;
  if(e.kind==="est"){
    const alt = Object.entries(e.alt||{}).map(([k,v])=>`${ALT_TXT[k]||k} ${esc(v)}`).join(" · ");
    h += `<div class="anc">🧭 <b>${esc(e.grade_label)}</b> — ${esc(e.why)}${e.case?`<br>사례: ${esc(e.case)}`:""}<br>날짜 근거: ${esc(e.anchor)}${alt?`<br>근거별 날짜: ${alt}`:""}</div>`;
    const cond = Object.entries(e.cond||{}).filter(([,v])=>v!==null).map(([k,v])=>`${COND_TXT[k]||k}: ${v?"해당":"해당 없음"}`).join(" · ");
    if(cond) h += `<div class="ev">참고 신호(적중률 측정 중, 판정엔 안 씀) — ${esc(cond)}</div>`;
    h += (e.warn||[]).map(w=>`<div class="ev">⚠ ${esc(w)}</div>`).join("");
  }
  return h;
}
function companyBlock(stock){   // 이 회사의 정관·결정기관·결산월·계획·근거 (research.json)
  const c = (RES.companies||{})[stock];
  if(!c) return "";
  const ch = Object.entries(c.charter||{}).map(([g,x])=>`${g}배당: ${esc(CH_TXT[x.v]||x.v)} <span class="sub">(${esc(x.src)})</span>`).join("<br>");
  const og = Object.entries(c.organ||{}).map(([g,v])=>`${g} ${esc(v)}`).join(" · ");
  const jd = Object.entries(c.judgments||{}).map(([t,j])=>`<div class="row">· ${esc(t)} ${esc(j.quarter)}: <b>${esc(j.grade_label)}</b> <span class="sub">${esc(j.why)}${j.case?` · 사례: ${esc(j.case)}`:""}</span></div>`).join("");
  let h = `<div class="why"><div class="wh">🏷️ 이 회사의 기준일 판정</div>${jd}
    <div class="row">정관상 배당기준일: ${ch||"정보 없음"}</div>
    <div class="row">배당액 결정기관: ${og||"미상"} · 결산월 ${esc(String(c.acc_mt))}월${c.acc_known?"":" (조회 실패 — 12월 가정)"}</div>`;
  if(c.charter_pending && c.charter_pending.date) h += `<div class="row">주총(${esc(c.charter_pending.date)}) 정관 기준일 변경 안건 상정 — 결과 대기</div>`;
  (c.notices||[]).forEach(n=> h += `<div class="ev">📣 ${esc(n.date)} ${esc(n.title)} → ${esc(n.quarter)} ${esc(n.div_type)}${n.hint?` (${esc(n.hint)} 이후)`:""}</div>`);
  (c.plans||[]).forEach(p=> h += `<div class="ev">📑 ${esc(p.date)} ${esc(p.title)}: ${p.lines.map(esc).join(" … ")}</div>`);
  h += (c.evidence||[]).map(x=>`<div class="ev">· ${esc(x)}</div>`).join("");
  return h + `</div>`;
}
function whyBlock(e){
  // "왜 이 날짜인가" — 파생 날짜 설명 + 5단계 사다리 + 회사 판정 + 배당 이력
  let h = `<div class="why"><div class="wh">📍 날짜 산출 근거</div>
    <div class="row">📌 <b>기준일(${esc(e.record_date)})</b> — 이날 주주명부에 올라 있어야 배당. 배당락·매수일은 여기서 자동 계산됩니다.</div>
    <div class="row">🗓️ <b>배당매수일(${esc(e.confirm_date||"-")})</b> — 기준일 T-2(국내 T+2 결제). <b>이날까지 매수</b>.</div>
    <div class="row">🚫 <b>배당락일(${esc(e.ex_date||"-")})</b> — 기준일 T-1. 이날부터 배당 없음. 현금배당은 거래소 가격조정 없이 시장에서 통상 배당액만큼 하락.</div>
    <div class="row" style="margin-top:3px;color:var(--muted)">※ 영업일: 주말·한국 공휴일·근로자의날·연말폐장 제외.</div>`;
  h += stageLadder(e);
  return h + `</div>` + companyBlock(e.stock) + divHistBlock(e.stock);
}

            수익률 = ${bonus?"현재가 ÷ 기준가 − 1":"(현재가 + 1주당 배정주식수 × 증서 이론가) ÷ 권리부 매수가 − 1"}.</div>

        <a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">🔗 DART 원문 보기</a>

// ── 엑셀: 보고 있는 달 1일부터 이후 배당 전부 (장부 그대로, 검색·시장 필터 반영) ──
function exportXlsx(){
  const from = dISO(calendar.view.currentStart);
  const G = BOOK.grades;
  const picked = ROWS.filter(e=> shown(e) && e.ex_date >= from);
  const rows = picked.map(e=> ({
    "종목코드": "A" + e.stock, "종목명": e.corp, "시장": {KOSPI:"KP", KOSDAQ:"KQ"}[e.market] || e.market,
    "구분": e.grade_label, "사례": e.case || "", "배당종류": e.div_type || "", "주당배당금(원)": e.per_share ? Number(e.per_share) : "",
    "기준일": e.record_date, "배당매수일(T-2)": e.confirm_date, "배당락일(T-1)": e.ex_date,
    "몇월 만기 후": e.after_expiry, "배당락 월물": e.ex_month, "근거": e.basis_text, "금액 근거": e.amount_basis || "",
  }));
  if(!rows.length){ alert(`${from} 이후 배당이 없습니다.`); return; }
  // 서식 — 머리줄 남색, 구분은 화면 범례처럼 진함(확실)→회색(근거 약함)
  const LINE = {style:"thin", color:{rgb:"BFBFBF"}};
  const BOX = {top:LINE, bottom:LINE, left:LINE, right:LINE};
  const HEAD = {font:{bold:true, color:{rgb:"FFFFFF"}}, fill:{fgColor:{rgb:"1F4E78"}}, alignment:{vertical:"center", wrapText:true}, border:BOX};
  const SEC = {font:{bold:true, sz:12, color:{rgb:"1F4E78"}}, fill:{fgColor:{rgb:"DDEBF7"}}, border:BOX};
  const TITLE = {font:{bold:true, sz:14, color:{rgb:"1F4E78"}}};
  const NOTE = {font:{italic:true, color:{rgb:"595959"}}};
  const CELL = {alignment:{vertical:"top"}, border:BOX};
  const WRAP = {alignment:{vertical:"top", wrapText:true}, border:BOX};
  const fillOf = k => G[k] ? {fill:{fgColor:{rgb:G[k].xl}}} : {};
  const paint = (ws, fn) => {
    const r = XLSX.utils.decode_range(ws["!ref"]);
    for(let R=r.s.r; R<=r.e.r; R++) for(let C=r.s.c; C<=r.e.c; C++){
      const ref = XLSX.utils.encode_cell({r:R, c:C});
      ws[ref] = ws[ref] || {t:"s", v:""};
      ws[ref].s = fn(R, C, ws[ref].v);
    }
  };
  const ws = XLSX.utils.json_to_sheet(rows);
  paint(ws, (R, C)=> R===0 ? HEAD : C===3 ? {...CELL, ...fillOf(picked[R-1].grade), font:{bold:true}} : CELL);
  ws["!cols"] = [9,16,5,34,50,9,11,11,13,13,13,10,70,30].map(w=> ({wch:w}));
  ws["!autofilter"] = {ref: ws["!ref"]};
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "배당");
  // 설명 탭 — 구분·칸 뜻. 장부의 구분 표를 그대로 씀
  const guide = [
    ["구분 칸 색", "뜻 — 구분 칸에 그 회차의 구분, 근거 칸에 공시 링크 또는 '예상 기준일 날짜 — 그 날짜를 잡은 이유'. 색은 날짜가 얼마나 확실한지"],
    ...Object.entries(G).map(([k, g])=> [g.label, g.desc, k]),
    ["※ 기말", "결산배당은 결산기말, 분기배당은 분기말, 중간배당은 반기말 — 구분 칸에는 그 배당종류의 말로 적힘"],
    [],
    ["칸", "뜻"],
    ["종목코드", "A + 6자리 종목코드"],
    ["시장", "KP 코스피 / KQ 코스닥"],
    ["사례", "사례 구분의 근거 — 선진화 정관이 된 뒤 같은 종류 배당 회차(또는 이번 회차 기준일 안내 자율공시)와 DART 링크, 사례 없음이면 정관 확인 시점"],
    ["배당매수일(T-2)", "이날까지 사야 배당을 받음 (기준일까지 결제되는 마지막 영업일의 2영업일 전)"],
    ["배당락일(T-1)", "이날부터 사면 배당 없음 — 주가가 통상 배당액만큼 빠짐"],
    ["몇월 만기 후", "배당매수일이 들어가지 않는 가장 끝 월물(배당매수일 당일 이전에 끝나는 마지막 만기, 만기 당일 포함) + '만기 후'"],
    ["배당락 월물", "배당락이 걸리는 주식선물 월물 = 배당락일 이후 첫 만기(매월 둘째 목요일)"],
    ["근거", "확정은 DART 공시일·링크, 예상은 예상 기준일·이유, 판정 근거, 날짜를 잡은 근거"],
    ["금액 근거", "예상 금액은 같은 종류 직전 정기 회차 금액 반복 (특별배당 섞인 회차 제외)"],
    ["참고 공시 탭", "이 목록 종목들에 대해 배당 산출이 읽은 DART 공시 전부(2년치)와 정기보고서 배당 표 — 공시마다 읽어 낸 내용과 원문 링크"],
    [],
    ["뽑은 범위", `${from} 이후 배당락 · 검색·시장 필터 반영 · ${new Date().toLocaleString("ko-KR")} 기준`],
  ];
  const gs = XLSX.utils.aoa_to_sheet(guide.map(r=> r.slice(0, 2)));   // 3번째 값은 색 단계(표에는 안 씀)
  paint(gs, (R, C, v)=> {
    const row = guide[R];
    if(!row.length) return {};
    if(row[0]==="구분 칸 색" || row[0]==="칸") return HEAD;
    if(row[0]==="뽑은 범위") return NOTE;
    return C===0 ? {...WRAP, ...fillOf(row[2]), font:{bold:true}} : WRAP;
  });
  gs["!cols"] = [{wch:44}, {wch:90}];
  XLSX.utils.book_append_sheet(wb, gs, "설명");
  const logic = [
    ["산출 로직 — 기준일 하나를 맞히면 배당락일·매수일·월물은 공식으로 따라 나온다. 근거는 전부 회사가 DART에 낸 공시"],
    [],
    ["1. 흐름", ""],

    ["기준일 판정", "이번 회차 기준일이 결산기말·분기말 고정인지, 이사회가 따로 정하는 날인지"],

    ["올해 실적발표 예정일 (결산실적공시예고·IR)", "실적발표일 + 작년 배당결정→기준일 일수"],
    ["작년 날짜 반복 (올해 근거가 아직 없음)", "작년 같은 회차 기준일 + 52주 (같은 요일)"],

    ["자율공시 'N월 이후'", "기준일 ≥ N월 1일"],
    ["미실시", "날짜 근거(주총·실적발표)가 3일 넘게 지났는데 배당 공시가 없으면 그 회차는 예상에서 뺌"],
    [],
    ["5. 배당락일 · 매수일", ""],

    ["배당락일", "L − 1 영업일"],
    ["배당매수일", "L − 2 영업일 (예: 기준일 12/31 휴장 → L 12/30, 배당락 12/27, 매수일 12/26)"],
    [],
    ["6. 월물과 지수배당포인트", ""],

  ];
  const ls = XLSX.utils.aoa_to_sheet(logic);
  paint(ls, (R, C, v)=> {
    const row = logic[R];
    if(R===0) return TITLE;
    if(!row.length) return {};
    if(/^\d\. /.test(row[0])) return SEC;
    if(String(row[0]).startsWith("※")) return NOTE;
    return WRAP;
  });
  ls["!cols"] = [{wch:70}, {wch:100}];
  XLSX.utils.book_append_sheet(wb, ls, "산출로직");
  const stocks = new Set(picked.map(e=> e.stock));
  const src = SRC.rows.filter(r=> stocks.has(r.stock)).map(({stock, ...r})=> r);
  const ss = XLSX.utils.json_to_sheet(src);
  paint(ss, (R, C)=> R===0 ? HEAD : CELL);
  ss["!cols"] = [9,16,11,30,40,80,60].map(w=> ({wch:w}));
  ss["!autofilter"] = {ref: ss["!ref"]};
  XLSX.utils.book_append_sheet(wb, ss, "참고 공시");
  XLSX.writeFile(wb, `배당목록_${from}부터_${dISO(new Date())}.xlsx`, {bookSST:true});
}

async function getJSON(name){ return (await fetch(`${DATA}${name}?_=${Date.now()}`)).json(); }
async function loadData(){
  BOOK = await getJSON("div_book.json");
  ROWS = BOOK.rows;
  if(SRC.generated_at !== BOOK.generated_at) try{ SRC = await getJSON("div_sources.json"); }catch(_){}
  try{ CAP = (await getJSON("capital.json")).events||[]; }catch(_){ CAP = []; }
  try{ RES = await getJSON("research.json"); }catch(_){}
  try{ HALT = (await getJSON("halts.json")).events||[]; }catch(_){ HALT = []; }
  try{ DP = await getJSON("divpoints.json"); }catch(_){ DP = null; }
  let chk = null;
  try{ chk = await getJSON("dividend_check.json"); }catch(_){}
  const bad = chk && !chk.ok ? ` · ⚠ 데이터 점검 오류 ${chk.errors.length}건 (${chk.checked_at}) — ${chk.errors[0]}` : "";
  const meta = document.getElementById("meta");
  meta.textContent = `💰 배당 ${BOOK.count.div} · 💡예상 ${BOOK.count.est} · 📈 증자 ${CAP.length} · 🚫 정지 ${HALT.length}${bad}`;
  meta.style.color = bad ? "#f87171" : "";
  document.getElementById("estLegend").innerHTML = Object.values(BOOK.grades)
    .map(g=> `<i style="${g.style.ex}"></i>${esc(g.label)}`).join(" ");
  applyFilters();
  if(divListMode) renderDivToday();
}
function refresh(){ return keepScroll(loadData); }   // 다시 그려도 보던 스크롤 위치 유지 (공시캘린더 탭이 열릴 때 바깥에서도 부름)

async function boot(){
  // 만기일·휴장일 먼저 로드 — 캘린더 render 전에 HOL 을 채워야 휴일 빨간색이 첫 렌더부터 적용됨
  try{ const ex = await getJSON("expiries.json");
       EXP = ex.events||[]; HOL = new Set(ex.holidays||[]); EXPD = new Set(EXP.map(e=>e.date)); }catch(_){}
  const eventClick = (info)=>{ info.jsEvent.preventDefault(); const p=info.event.extendedProps; showDetail(p); if(info.jsEvent.detail>=2) openChart(p.stock||p.code); };   // 단일=상세 / 더블=차트
  calendar = new FullCalendar.Calendar(document.getElementById("calendar"),{
    initialView:"dayGridMonth", locale:"ko", height:"auto", firstDay:0, dayMaxEvents:3,
    stickyHeaderDates:false, moreLinkText:(n)=>`+${n}건`,
    showNonCurrentDates:false, fixedWeekCount:false,   // 전월·다음월 날짜 숨김 + 여분 주 제거
    headerToolbar:{left:"prev,next today",center:"title",right:""},
    buttonText:{today:"오늘"},
    dayCellClassNames:(a)=>{ const iso=dISO(a.date), c=[]; if(HOL.has(iso))c.push("holiday"); if(EXPD.has(iso))c.push("expday"); return c; },   // 휴장일 빨간글자·만기일 별표
    datesSet:()=> markSel(),
    dateClick:(info)=> selectDate(info.dateStr),
    moreLinkClick:(info)=>{ selectDate(dISO(info.date)); return "none"; },   // '+N' → 아래 날짜 목록으로
    eventClick:(info)=>{ selectDate(dISO(info.event.start)); eventClick(info); },
    eventDidMount:(info)=>{ const st = info.event.extendedProps._style; if(st) info.el.style.cssText += ";" + st; },
  });
  dayCal = new FullCalendar.Calendar(document.getElementById("dayList"),{
    initialView:"listDay", locale:"ko", headerToolbar:false, height:"auto", allDayText:"",
    noEventsContent:"이 날 일정이 없습니다", eventClick,
    eventContent:(arg)=>{   // 시장 구분 KP(코스피)·KQ(코스닥)을 앞에
      const m = arg.event.extendedProps.market;
      const mk = {KOSPI:"KP", KOSDAQ:"KQ"}[m];
      return {html: (mk?`<span class="mkt ${m}">${mk}</span> `:"") + esc(arg.event.title)};
    },
  });
  calendar.render();
  dayCal.render();
  await loadData();
  renderDivToday();
  setInterval(()=>{ if(!window.frameElement || window.frameElement.offsetParent) refresh(); }, 30000);   // 30초마다 — 공시캘린더에 끼워져 숨겨져 있으면 쉼
}

document.getElementById("q").addEventListener("input",e=>{ filters.q=e.target.value; applyFilters(); });
document.getElementById("xlsxBtn").addEventListener("click", exportXlsx);
[["showBuy","buy"],["showEx","ex"]].forEach(([id,k])=>{
  const el = document.getElementById(id);
  el.checked = show[k];
  el.addEventListener("change",()=>{
    show[k] = el.checked;
    try{ localStorage.setItem("div.show", JSON.stringify(show)); }catch(_){}
    applyFilters();
  });
});
document.querySelectorAll(".chip[data-market]").forEach(c=> c.addEventListener("click",()=>{
  const mk=c.dataset.market; filters[mk]=!filters[mk];
  c.classList.toggle("on",filters[mk]); applyFilters();
  if(divListMode) renderDivToday();
}));

boot().catch(err=>{
  document.getElementById("meta").textContent = "데이터 로드 실패: "+err.message;
  console.error(err);
});
</script>
